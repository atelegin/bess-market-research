// ── § 01 Scenario context ───────────────────────────────────────
const Sec01 = ({ c }) => {
  const f = c.fan22mo;
  // Toggle: M×12 (each month's pace × 12) vs Rolling 12-month sum. Applies to both charts.
  const [paceMode, setPaceMode] = React.useState("m12");
  const variant = (f && f[paceMode]) || {};
  // Single canonical cube cone (end-of-2025 anchor) extended backward
  // to 2024 for retrodiction context. No anchor toggle; 2024-12 anchor
  // was retired (only 6 months pre-cliff data, too thin to be credible).
  // Scenario cone is ALWAYS rendered as trailing-12mo (smooth, stable
  // long-horizon read) regardless of the M×12/rolling toggle — only the
  // realised line switches metric. M×12 cone monthly × 12 was too noisy
  // even after 3-mo smoothing. Legacy snapshots may still ship flat keys.
  const anchorFan = (c.fanByAnchor && c.fanByAnchor["2025-12"]) || {};
  const fan = (anchorFan && anchorFan.rolling)
    || { fanCentral: c.fanCentral, fanBull: c.fanBull, fanBear: c.fanBear };
  // Long-view forward cone. Primary: the rebuilt scenario cube's central
  // path + data-anchored P10-P90 band (c.cubeCone, anchored end-2025).
  // Fallback for legacy snapshots without the posterior: the named
  // bull/mid/bear cube cells. Either way the cone stays trailing-12mo /
  // 2024-2040 — independent of the left chart's annualisation toggle.
  const cubeCone = c.cubeCone;
  const coneCentral = cubeCone ? cubeCone.central : fan.fanCentral;
  const coneUpper   = cubeCone ? cubeCone.upper   : fan.fanBull;
  const coneLower   = cubeCone ? cubeCone.lower   : fan.fanBear;
  // Bull / Central / Bear vocabulary on both data sources — the cube's
  // P90/P10 band edges are presented as the optimistic / pessimistic
  // scenario lines (relabelled from the percentile terms at Anton's
  // request, matching April's framing).
  const coneLabels  = { central: "Central scenario", upper: "Bull", lower: "Bear" };
  // fanRealisedHistory is now {m12, rolling}; legacy snapshots may still ship a flat list.
  // The annualisation toggle drives the realised line on BOTH charts —
  // the right-hand long-view realised follows paceMode just like the left
  // stacked chart. The cube cone behind it stays 2024-2040 untouched (it's
  // a static posterior, not a function of the toggle).
  const historyByMode = c.fanRealisedHistory;
  const realisedHistoryFull = Array.isArray(historyByMode)
    ? historyByMode
    : ((historyByMode && historyByMode[paceMode]) || []);
  // Show the FULL realised history on the long view (no trailing-12 slice)
  // and start the x-axis at the earliest realised month, so the realised
  // line uses the maximum number of months. (Stable ref via useMemo so
  // useTween doesn't see a "new" target every render.)
  const realisedHistory = React.useMemo(
    () => realisedHistoryFull, [realisedHistoryFull]);
  // Earliest x on the long view = earliest realised (or cone) point, floored
  // to the half-year grid so the cone's mid-year anchor isn't clipped.
  const longViewXMin = React.useMemo(() => {
    const ys = realisedHistory.map(p => p.y)
      .concat((coneCentral || []).map(p => p.y));
    return ys.length ? Math.floor(Math.min(...ys) * 2) / 2 : 2024;
  }, [realisedHistory, coneCentral]);
  // Morph both charts between the M×12 and rolling-12mo metrics on toggle.
  const tStreams = useTween(variant.streams);
  const tRealised = useTween(variant.realised);
  const tCentral = useTween(variant.central);
  const tHistory = useTween(realisedHistory);
  // Lock the stacked-revenue y-axis to the union of BOTH metrics so the
  // morph plays inside a fixed frame. Without this the axis rescales every
  // tween frame (M×12's spike forces a taller axis than rolling's flat
  // line) and the whole coordinate system warps mid-animation — that
  // compounding warp, not the morph itself, is what read as cheap.
  const stackYMax = React.useMemo(() => {
    const collect = (v) => (v ? (v.realised || []).concat(v.central || []) : []);
    const vals = [...collect(f.m12), ...collect(f.rolling)].filter(x => typeof x === "number" && !isNaN(x));
    const raw = Math.max(1, ...vals) * 1.05;
    return Math.ceil(raw / 5) * 5;
  }, [f]);
  // Explanatory caption: the cube's central path bracketed by a bull /
  // bear case. Plain-language drivers (no analyst-house or jargon terms),
  // and the close states why the width matters more than the level.
  const captionNode = (
    <span style={{ color: T.mute }}>
      Three cube paths.{" "}
      <span style={{ color: T.high, fontWeight: 700 }}>Bull</span> — slow fleet build-out, deeper solar dips, aFRR recovers.{" "}
      <span style={{ color: T.ink, fontWeight: 700 }}>Central</span> — BNetzA NEP central fleet, partial aFRR recovery.{" "}
      <span style={{ color: T.amber, fontWeight: 700 }}>Bear</span> — fast fleet build-out spreads revenue thinner across more MW, weak solar, low aFRR.
    </span>
  );
  // Run-rate / trailing-year control — the SAME shared SegToggle component as
  // the §02 chart-view and §02/§03 MoM|YoY toggles, so all three read and
  // behave identically (clean segmented switch, no per-button transition).
  const PaceToggle = () => (
    <SegToggle
      value={paceMode}
      onChange={setPaceMode}
      options={[
        { value: "m12", label: "run-rate" },
        { value: "rolling", label: "trailing year" },
      ]}
    />
  );
  return (
    <section id="sec-01" style={{ padding: "32px 40px 24px 40px" }}>
      <SectionHead
        num={1}
        title="Scenario context"
      />
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 16, margin: "0 0 18px 0", flexWrap: "wrap" }}>
        <p style={{
          fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
          fontSize: 14, lineHeight: 1.5, color: T.body,
          margin: 0, maxWidth: 900, flex: "1 1 100%", minWidth: 0,
          textWrap: "pretty",
        }}>
          <Kk style={{ marginRight: 10 }}>In short</Kk>
          {c.sec01InShort}
        </p>
        <div style={{ display: "flex", alignItems: "center", flexShrink: 0, marginLeft: "auto" }}>
          <PaceToggle />
        </div>
      </div>
      <div className="ed-cols-2" style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.7fr) minmax(0, 1fr)", gap: 36, alignItems: "start" }}>
        <Figure
          title="13 months of stack revenue"
          sub={paceMode === "m12"
            ? "k€ per MW per year (this-month pace × 12) · realised stack vs the central scenario"
            : "k€ per MW per year (trailing-12 month sum) · realised stack vs the central scenario"}
        >
          <Stack22moFan
            months={f.months}
            streams={tStreams}
            realised={tRealised}
            central={tCentral}
            currentIdx={f.currentIdx}
            yMaxOverride={stackYMax}
            w={780} h={300}
          />
          <div style={{ display: "flex", gap: 16, marginTop: 12, paddingTop: 10, borderTop: `1px solid ${T.lineSoft}`, flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: T.body, letterSpacing: "0.04em" }}>
              <span style={{ width: 10, height: 10, background: T.wh, opacity: 0.32, display: "inline-block" }} /> Wholesale
            </span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: T.body, letterSpacing: "0.04em" }}>
              <span style={{ width: 10, height: 10, background: T.acap, opacity: 0.32, display: "inline-block" }} /> aFRR cap
            </span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: T.body, letterSpacing: "0.04em" }}>
              <span style={{ width: 10, height: 10, background: T.fcr, opacity: 0.32, display: "inline-block" }} /> FCR
            </span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, color: T.body, letterSpacing: "0.04em" }}>
              <span style={{ width: 10, height: 10, background: T.aeng, opacity: 0.32, display: "inline-block" }} /> aFRR eng
            </span>
            <LegLine color={T.ink}  label="Realised total"    width={2.4} />
            <LegLine color={T.mute} label="Central scenario" dash="6 4" width={1.2} />
          </div>
        </Figure>
        <Figure
          title="The long view · 2024 to 2040"
          sub="k€/MW/yr · realised, then the cube's bull–central–bear range"
          caption={captionNode}
        >
          <MultiYearFan
            realisedHistory={tHistory}
            central={coneCentral}
            bull={coneUpper}
            bear={coneLower}
            labels={coneLabels}
            xMin={longViewXMin}
            width={420} height={260}
          />
        </Figure>
      </div>
    </section>
  );
};

// ── § 02 Wholesale shape ────────────────────────────────────────
const Sec03 = ({ c, cmpMode = "yoy", onCmpSelect = () => {} }) => {
  // The toggle below the section head swaps ONLY the two charts (daily
  // bars + hourly profile) between the live focused month and the
  // same-month-prior-year mirror. KPI tiles, IN SHORT and the Top-3
  // driver list stay locked to the focused month so the comparison
  // story (numbers, narrative) remains the anchor.
  const w = c.wholesale;                      // always the live month
  const yoyView = w.yoyView;
  const [chartView, setChartView] = React.useState("live");
  const chartW = (chartView === "yoy" && yoyView) ? yoyView : w;
  // The right-hand Top-3 panel always describes the live (headline) month.
  // When the chart is flipped to the prior year, dim the panel and cut its
  // hover cross-link so its 2026 day indices don't highlight 2025 bars.
  const isYoy = chartView === "yoy";
  const liveMonthLabel = w.monthLabel || c.monthAbbr || c.month;
  // Morph the daily-spread bars and hourly profile between the live month
  // and its prior-year mirror when the toggle flips. Tones/ranks are
  // categorical and snap; only the numeric series tween.
  const tDaily = useTween(chartW.daily);
  const tDailyShapes = useTween(chartW.dailyShapes);
  const tHourlyMonth = useTween(chartW.hourlyMonth);
  const tHourlyTrailing = useTween(chartW.hourlyTrailing);
  const a = w.anchors || {};
  const yoy = w.yoy || {};
  const mom = w.mom || {};
  const cmp = cmpMode === "mom" ? mom : yoy;
  const cmpLabel = cmpMode === "mom"
    ? (mom.monthLabel || "prior month")
    : (yoy.yearLabel || "year ago");
  const cyclesPrev = cmpMode === "mom" ? mom.cyclesPerDayPrev : w.cyclesPerDayProxyPrev;
  const realisedCmpPct = cmpMode === "mom" ? mom.realisedWholesalePct : w.realisedWholesaleYoyPct;
  // Morph the delta values between MoM and YoY (count old → new) the same way
  // the charts morph on toggle — useTween off rAF. No fade/remount wrapper:
  // useTween needs the tiles to PERSIST so it sees the old→new target.
  const _cyclesDeltaPct = (w.cyclesPerDayProxy != null && cyclesPrev)
    ? (w.cyclesPerDayProxy - cyclesPrev) / cyclesPrev * 100 : null;
  const tSpreadPct = useTween(cmp.spreadMeanPct);
  const tNegPct = useTween(cmp.negHoursPct);
  const tCyclesPct = useTween(_cyclesDeltaPct);
  const tRealisedPct = useTween(realisedCmpPct);
  // Best-day / normal / weak thresholds are pinned to the LIVE month
  // (e.g. April 2026), even when the toggle shows the prior-year mirror.
  // Reason: the comparison is "how would April 2025 days have classified
  // under today's distribution?" — re-anchoring the legend to 2025's own
  // percentiles would let weaker absolute days look good, defeating the
  // point of the YoY view.
  const dailyP25 = (w.anchors || {}).dailyTb2P25;
  const dailyP75 = (w.anchors || {}).dailyTb2P75;
  // When the YoY view is active, re-classify its days under the LIVE
  // month's P25/P75 cutoffs so the bar colors match the (pinned) legend.
  // Falls back to the precomputed `chartW.dailyTones` when thresholds
  // are missing — same behaviour as before this patch.
  const yoyTonesPinned = (chartView === "yoy" && yoyView && yoyView.daily && dailyP25 != null && dailyP75 != null)
    ? yoyView.daily.map(v => (
        v == null ? null
        : v >= dailyP75 ? "good"
        : v <= dailyP25 ? "bad"
        : "warn"
      ))
    : null;
  const barTones = yoyTonesPinned || chartW.dailyTones;
  const [hoverDay, setHoverDay] = React.useState(null);
  const bestDay = w.top3Days && w.top3Days[0];
  // Sliding highlight over the Top-3 days list: instead of a per-row tint
  // that jumps, one overlay element measured to the active row's box and
  // CSS-transitioned, so moving from one top day to the next glides the
  // highlight along. The active row is whichever top-3 day matches the
  // shared hoverDay bar index (set from the bars or the list itself).
  const top3RowRefs = React.useRef([]);
  const top3ActiveIdx = (w.top3Days || []).findIndex(d => {
    const di = d.date ? parseInt(d.date.slice(8, 10), 10) - 1 : null;
    return di != null && di === hoverDay;
  });
  const [top3Hl, setTop3Hl] = React.useState(null);
  React.useLayoutEffect(() => {
    if (top3ActiveIdx < 0) { setTop3Hl(h => (h ? { ...h, visible: false } : null)); return; }
    const el = top3RowRefs.current[top3ActiveIdx];
    if (el) setTop3Hl({ top: el.offsetTop, height: el.offsetHeight, visible: true });
  }, [top3ActiveIdx, chartView]);
  // Unified y-bounds across the live and YoY toggle views so flipping
  // the toggle doesn't auto-rescale. Both DailySpreadBars and
  // HourlyShape get a single yMaxOverride derived from the union.
  const niceMaxLocal = (v) => {
    if (!v) return 10;
    const e = Math.pow(10, Math.floor(Math.log10(v)));
    const m = v / e;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e;
  };
  const dailyMaxBoth = Math.max(
    w.daily && w.daily.length ? Math.max(...w.daily) : 0,
    yoyView && yoyView.daily && yoyView.daily.length ? Math.max(...yoyView.daily) : 0,
  );
  const dailyBarsYMax = niceMaxLocal(dailyMaxBoth * 1.05);
  const flat = (arr) => (arr || []).flat();
  const allHourly = [
    ...(w.hourlyMonth || []),
    ...(w.hourlyTrailing || []),
    ...flat(w.dailyShapes),
    ...(yoyView ? (yoyView.hourlyMonth || []) : []),
    ...(yoyView ? (yoyView.hourlyTrailing || []) : []),
    ...flat(yoyView && yoyView.dailyShapes),
  ];
  const sortedAH = [...allHourly].sort((a, b) => a - b);
  const p95 = sortedAH.length ? sortedAH[Math.floor(0.95 * (sortedAH.length - 1))] : 200;
  const hourlyYMax = niceMaxLocal(Math.max(p95, Math.max(...(w.hourlyMonth || [0])) * 1.05));
  const ToggleChip = ({ active, label, onClick }) => (
    <button
      type="button"
      onClick={onClick}
      style={{
        border: `1px solid ${active ? T.ink : T.line}`,
        background: active ? T.ink : T.card,
        color: active ? T.bg : T.body,
        fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
        letterSpacing: "0.08em", textTransform: "uppercase",
        fontWeight: 700, padding: "4px 10px",
        cursor: "pointer", borderRadius: 2,
      }}
    >{label}</button>
  );
  return (
    <section id="sec-03" style={{ padding: "32px 40px 24px 40px" }}>
      <SectionHead num={2} title="Wholesale shape" />
      <p style={{
        fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
        fontSize: 14, lineHeight: 1.5, color: T.body,
        margin: "0 0 22px 0", maxWidth: 900, textWrap: "pretty",
      }}>
        <Kk style={{ marginRight: 10 }}>In short</Kk>
        <span dangerouslySetInnerHTML={{ __html: w.inShort }} />
      </p>
      <div className="ed-cols-2" style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.6fr) minmax(0, 1fr)", gap: 36, alignItems: "start" }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
          <Figure
            title={<>Daily TB2<a
                href="#sec03-tb2-note"
                onClick={(e) => {
                  e.preventDefault();
                  const t = document.getElementById("sec03-tb2-note");
                  if (t) t.scrollIntoView({ behavior: "smooth", block: "center" });
                }}
                style={{ color: T.accent, textDecoration: "none", cursor: "pointer" }}
                title="See TB2 definition below"
              ><sup style={{ fontSize: "0.65em", marginLeft: 1 }}>1</sup></a> spread · {chartW.monthLabel || c.month}</>}
            sub={<>
              {dailyP25 && dailyP75 ? (
                <>
                  <span style={{ color: T.high, fontWeight: 700 }}>best days &gt; €{Math.round(dailyP75)}</span> ·{" "}
                  <span style={{ color: T.amber, fontWeight: 700 }}>normal €{Math.round(dailyP25)} – €{Math.round(dailyP75)}</span> ·{" "}
                  <span style={{ color: T.low, fontWeight: 700 }}>weak &lt; €{Math.round(dailyP25)}</span>
                  {" (€/MWh)"}
                </>
              ) : (
                <>
                  <span style={{ color: T.high, fontWeight: 700 }}>best days</span> ·{" "}
                  <span style={{ color: T.amber, fontWeight: 700 }}>normal</span> ·{" "}
                  <span style={{ color: T.low, fontWeight: 700 }}>weak</span>
                  {" (€/MWh)"}
                </>
              )}
              {" · "}
              <span style={{
                display: "inline-block", width: 10, height: 10,
                background: T.tint, border: `1px solid ${T.line}`,
                verticalAlign: "-1px", marginRight: 4,
              }} />
              <span style={{ color: T.mute }}>weekend &amp; holiday</span>
            </>}
            right={yoyView && (
              <SegToggle
                value={chartView}
                onChange={setChartView}
                options={[
                  { value: "yoy", label: yoyView.monthLabel || "prior year" },
                  { value: "live", label: w.monthLabel || "this month" },
                ]}
              />
            )}
          >
            <DailySpreadBars data={tDaily} tones={barTones} topRanks={chartW.dailyTopRanks} weather={chartW.dailyWeather} isWeekend={chartW.dailyIsWeekend} p25={dailyP25} p75={dailyP75} hoverDay={hoverDay} onHover={setHoverDay} yMaxOverride={dailyBarsYMax} w={720} h={190} />
            {/* Glyph legend BELOW the chart — same placement as §03's
                regime-glyph row (glyphs sit under the bars, so the key
                reads best directly beneath them). */}
            <div style={{
              display: "flex", flexWrap: "wrap", alignItems: "center", gap: "6px 16px", marginTop: 8,
              fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: T.mute,
            }}>
              <Kk style={{ color: T.mute }}>Glyph</Kk>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                <span style={{ fontSize: 13 }}>☀</span> high-solar day
              </span>
              <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
                <svg width={15} height={11} viewBox="0 0 15 11" stroke={T.body} strokeWidth={1} fill="none" strokeLinecap="round" style={{ opacity: 0.85 }}>
                  <path d="M0 3 Q3 0.5 6 3 T11 3 q2 0 2 -2" />
                  <path d="M0 8 Q4 5.5 7 8 T13 8" />
                </svg> high-wind day
              </span>
            </div>
          </Figure>
          <Figure
            title="Hourly price profile"
            right={<span style={{ display: "inline-flex", gap: 12 }}>
              <LegLine color={T.wh}   label={(chartW.monthLabel || c.monthAbbr) + " avg"} width={2.4} />
              <LegLine color={T.mute} label="1-year avg" dash="3 3" />
            </span>}
          >
            <HourlyShape month={tHourlyMonth} trailing={tHourlyTrailing} daily={tDailyShapes} dayTones={chartW.dailyTones} hoverDay={hoverDay} onHover={setHoverDay} yMaxOverride={hourlyYMax} w={720} h={220} />
          </Figure>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
              <Kk>Key numbers</Kk>
              <CmpToggle mode={cmpMode} onSelect={onCmpSelect} />
            </div>
            <KpiGrid cols={2}>
              <KpiCell
                label="Avg TB2 spread"
                value={fmtNum(w.spreadMean)}
                unit="€/MWh"
                delta={cmp.spreadMeanPct != null ? fmtDelta(tSpreadPct, 0) : null}
                sub={
                  cmp.spreadMeanPct != null
                    ? `vs ${cmpLabel}`
                    : null
                }
                tone={w.tones.spreadMean}
              />
              <KpiCell
                label="Cycles / day · benchmark"
                value={
                  w.cyclesPerDayProxy != null
                    ? w.cyclesPerDayProxy.toFixed(2)

                }
                delta={
                  (w.cyclesPerDayProxy != null && cyclesPrev)
                    ? fmtDelta(tCyclesPct, 0)
                    : null
                }
                sub={
                  cyclesPrev != null
                    ? `vs ${cmpLabel}`
                    : null
                }
                tone="accent"
              />
              <KpiCell
                label="Negative-price hours"
                value={fmtNum(w.negHours, 0)}
                unit="h"
                delta={cmp.negHoursPct != null ? fmtDelta(tNegPct, 0) : null}
                sub={
                  cmp.negHoursPct != null

                tone={w.tones.negHours}
              />
              <KpiCell
                label="Wholesale revenue"
                value={
                  w.realisedWholesaleEurMwMo
                    ? `€${(w.realisedWholesaleEurMwMo / 1000).toFixed(1)}k`

                }
                unit="/MW/mo"
                delta={realisedCmpPct != null ? fmtDelta(tRealisedPct, 0) : null}
                sub={
                  realisedCmpPct != null
                    ? `vs ${cmpLabel}`
                    : null
                }
                tone="accent"
              />
            </KpiGrid>
          </div>
          {w.top3Days && w.top3Days.length > 0 && (
            <div style={{
              opacity: isYoy ? 0.4 : 1,
              transition: "opacity 0.18s ease",
            }}>
              <Kk style={{ display: "block", marginBottom: 8 }}>
                Top-3 days · {liveMonthLabel}
              </Kk>
              <div
                onMouseLeave={() => !isYoy && setHoverDay(null)}
                style={{ display: "flex", flexDirection: "column", gap: 6, position: "relative" }}>
                {top3Hl && (
                  <div aria-hidden style={{
                    position: "absolute", left: 0, right: 0,
                    top: top3Hl.top, height: top3Hl.height,
                    background: T.tint, borderRadius: 2, zIndex: 0,
                    opacity: top3Hl.visible ? 1 : 0,
                    pointerEvents: "none",
                    transition: "top 0.28s cubic-bezier(0.4,0,0.2,1), height 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease",
                  }} />
                )}
                {w.top3Days.map((d, i) => {
                  // Convert ISO date to bar index (day-of-month - 1).
                  const dayIdx = d.date
                    ? parseInt(d.date.slice(8, 10), 10) - 1
                    : null;
                  return (
                  <div key={i}
                       ref={el => { top3RowRefs.current[i] = el; }}
                       onMouseEnter={() => !isYoy && dayIdx != null && setHoverDay(dayIdx)}
                       style={{
                         position: "relative", zIndex: 1,
                         display: "grid", gridTemplateColumns: "84px 1fr auto",
                         gap: 10, alignItems: "baseline",
                         fontFamily: "'Inter', sans-serif", fontSize: 12, color: T.body,
                         cursor: (!isYoy && dayIdx != null) ? "pointer" : "default",
                         padding: "2px 4px",
                         borderRadius: 2,
                       }}>
                    <Nm size={11} color={T.ink}>{d.label}</Nm>
                    <span style={{ fontStyle: d.driver ? "italic" : "normal", color: d.driver ? T.body : T.mute, fontFamily: "'Source Serif 4', serif", fontSize: 12.5 }}>
                      {d.driver || "—"}
                    </span>
                    <Nm size={11} color={T.mute}>{d.sharePct}%</Nm>
                  </div>
                  );
                })}
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr auto",
                  gap: 10, alignItems: "baseline",
                  marginTop: 4, paddingTop: 6, borderTop: `1px solid ${T.lineSoft}`,
                  fontFamily: "'Inter', sans-serif", fontSize: 12,

                  <Nm size={11.5} color={T.ink}>{fmtNum(w.top3SharePct, 0)}%</Nm>
                </div>
              </div>
            </div>
          )}
          {/* "Prior-month risks · materialised" removed 2026-06: the
              builder attached one generic "TB2 is elevated" signal to
              EVERY prior-month wholesale risk, so seasonal catalysts that

      <div style={{

// ── § 04 Capacity anatomy ───────────────────────────────────────
// Register pill — tone-driven word label (HIGH / NORMAL / SOFT / EXTREME).
// Anchor: trailing-12 percentile bucket of monthly clearing.
const REGISTER_TONE = {
  EXTREME: { bg: soft(T.low, 9.5), fg: T.low },
  HIGH: { bg: soft(T.amber, 9.5), fg: T.amber },
  FIRM: { bg: soft(T.amber, 9.5), fg: T.amber },
  NORMAL: { bg: "var(--ink-overlay)", fg: T.body },
  SOFT: { bg: soft(T.med, 9.5), fg: T.med },
  "EXTREME-LOW": { bg: soft(T.low, 7.8), fg: T.low },
};
// Plain-word labels so the pill is self-explanatory (was the raw code "SOFT",
// which read as jargon). The register buckets this month's clearing price
// against its own typical range over the trailing 12 months.
const REGISTER_LABEL = {
  EXTREME: "exceptional",
  HIGH: "high",
  FIRM: "firm",
  NORMAL: "typical",
  SOFT: "weak",
  "EXTREME-LOW": "very weak",
};
const RegisterPill = ({ register, style }) => {
  const key = (register || "").toUpperCase();
  const tone = REGISTER_TONE[key] || REGISTER_TONE.NORMAL;
  const label = REGISTER_LABEL[key] || register || "—";
  return (
    <span
      title="This month's clearing price vs its typical range (trailing 12 months)"
      style={{
        display: "inline-flex", alignItems: "center",
        padding: "3px 8px", borderRadius: 3,
        background: tone.bg, color: tone.fg,
        fontFamily: "'JetBrains Mono', monospace",
        fontSize: 9.5, fontWeight: 700,
        letterSpacing: "0.1em", textTransform: "uppercase",
        cursor: "help",
        ...style,
      }}>{label}</span>
  );
};

// (VerdictHeader removed — its content duplicates the In short narrative.)

// PosNegSplitCard — pure-layout. Five lines: price + register pill,
// prior-month compare with explicit month name, realised k€/MW for the
// direction this month (apples-to-apples vs wholesale and FCR),
// premium-window hour, driver sentence.
const PosNegSplitCard = ({ card }) => {
  if (!card) return null;
  const isNeg = card.direction === "NEG";
  const accentColor = isNeg ? T.amber : T.acap;
  const arrow = isNeg ? "▼" : "▲";
  const mom = card.momPct;
  // Single concise delta line: "+84% vs Mar 2026" — explicit month
  // (capacity is weakly seasonal, MoM is the right baseline). Delta
  // carries the semantic colour; the month context stays muted.
  const momDelta = (mom != null && !Number.isNaN(mom)) ? fmtDelta(mom, 0) : "";
  const momContext = momDelta ? `vs ${card.priorMonthLabel || "prior month"}` : "";
  const topHours = (card.topBlockHours || []).join(", ");
  return (
    <div style={{
      padding: 16, border: `1px solid ${T.line}`, borderRadius: 4,
      background: T.card, borderTop: `3px solid ${accentColor}`,
      display: "flex", flexDirection: "column", gap: 8, minWidth: 0,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{ color: accentColor, fontSize: 12, fontWeight: 700 }}>{arrow}</span>
        <Kk style={{ color: T.mute }}>{card.label}</Kk>
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
        <Nm size={26} color={T.ink}>€{card.valueEur != null ? card.valueEur.toFixed(1) : "—"}</Nm>
        <Nm size={11} color={T.mute} weight={500}>/MW/h</Nm>
        <RegisterPill register={card.register} style={{ marginLeft: "auto" }} />
      </div>
      {momDelta && (
        <DeltaSub delta={momDelta} context={momContext} style={{ marginTop: 0 }} />
      )}
      {topHours && (
        <div style={{
          fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: T.body,
          lineHeight: 1.45,
        }}>
          <span style={{ color: T.mute, marginRight: 6 }}>Premium</span>
          {topHours}
        </div>
      )}
      {card.driverLabel && (
        <div style={{
          fontFamily: "'Inter', sans-serif", fontSize: 12.5, color: T.body,
          lineHeight: 1.45, paddingTop: 6, borderTop: `1px dashed ${T.lineSoft}`,
        }}>
          <span style={{ color: T.mute, marginRight: 6 }}>Why</span>
          {card.driverLabel}
        </div>
      )}
    </div>
  );
};

const CALENDAR_REGIME_LEGEND = [
  { glyph: "☀", label: "solar surplus" },
  { glyph: "▲", label: "evening scarcity" },
  { glyph: "▼", label: "low-wind scarcity" },
  { glyph: "⇅", label: "tight both ways (POS + NEG elevated)" },
];

// Compact KPI tile for §04 right column — POS or NEG.
const AfrrDirectionTile = ({ card, mode }) => {
  // useTween must run unconditionally (before the early return) — morph the
  // delta on a MoM↔YoY switch the same way the charts morph, not a fade.
  const vsYoy = card ? (mode === "mom" ? card.vsMomPct : card.vsYoyPct) : null;
  const tVs = useTween(vsYoy);
  if (!card) return null;
  const isNeg = card.direction === "NEG";
  // Direction arrow is a tiny diacritic — kept neutral so the POS/NEG
  // channel never says "good/bad". The vs-base delta carries the semantic
  // colour via DeltaSub. Base toggles between same-month-last-year (YoY,
  // default) and previous month (MoM) via the §03 header CmpToggle.
  const accent = T.mute;
  const arrow = isNeg ? "▼" : "▲";
  const vsLabel = mode === "mom" ? card.momLabel : card.yoyLabel;
  const vsYoyStr = (vsYoy != null && !Number.isNaN(vsYoy)) ? fmtDelta(tVs, 0) : "";
  return (
    <div style={{
      padding: "14px 16px",
      display: "flex", flexDirection: "column", gap: 4,
      minWidth: 0,
    }}>
      <Kk style={{ fontSize: 9.5, color: T.mute }}>
        <span style={{ color: accent, marginRight: 5 }}>{arrow}</span>
        {card.label}
      </Kk>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginTop: 2 }}>
        <Nm size={22} color={T.ink}>€{card.valueEur != null ? card.valueEur.toFixed(1) : "—"}</Nm>
        <Nm size={11} color={T.mute} weight={500}>/MW/h</Nm>
        <RegisterPill register={card.register} style={{ marginLeft: "auto" }} />
      </div>
      {vsYoy != null && (
        <DeltaSub
          delta={vsYoyStr || null}
          context={`vs ${vsLabel}`}
        />
      )}
    </div>
  );
};

const Sec04 = ({ c, cmpMode = "yoy", onCmpSelect = () => {} }) => {
  const a = c.afrr || {};
  const [hoverDay, setHoverDay] = React.useState(null);
  // Derive hovered-day per-block data for fingerprint overlay.
  const hoverDayInfo = React.useMemo(() => {
    if (!hoverDay) return null;
    const cal = (a.regimeCalendar || []).find(d => d.date === hoverDay);
    if (!cal) return null;
    const ts = new Date(hoverDay + "T00:00:00");
    const dateLabel = "day " + ts.getDate();  // consistent with §02 ("day N")
    return {
      pos_blocks: cal.pos_blocks || null,
      neg_blocks: cal.neg_blocks || null,
      pos_total: cal.pos_daily_eur || 0,
      neg_total: cal.neg_daily_eur || 0,
      dateLabel,
    };
  }, [hoverDay, a.regimeCalendar]);
  const cards = a.cards || {};
  const dominant = ((a.verdict || {}).dominantDirection || "NEG").toUpperCase();
  const leftTile = dominant === "POS" ? cards.pos : cards.neg;
  const rightTile = dominant === "POS" ? cards.neg : cards.pos;
  const tod = a.tod || {};
  const calendar = a.regimeCalendar || [];
  // Combined Top-3 — ranked by absolute day total (POS + NEG €/MW),
  // matching the single rank badges on the chart. Comes pre-built from
  // dashboard_aggregations.py with direction-aware driver text (the
  // ``peak_dir`` decides whether the anomaly sentence talks about
  // PV-surplus vs scarcity).
  const top3 = a.top3Days || [];
  // Sliding highlight over the Top-3 days list — same idiom as §02: one
  // overlay measured to the active row's box and CSS-transitioned, so
  // moving between top days glides instead of the tint jumping. Active row
  // = whichever top-3 day matches the shared hoverDay (a date here).
  const top3RowRefs = React.useRef([]);
  const top3ActiveIdx = top3.findIndex(d => d.date === hoverDay);
  const [top3Hl, setTop3Hl] = React.useState(null);
  React.useLayoutEffect(() => {
    if (top3ActiveIdx < 0) { setTop3Hl(h => (h ? { ...h, visible: false } : null)); return; }
    const el = top3RowRefs.current[top3ActiveIdx];
    if (el) setTop3Hl({ top: el.offsetTop, height: el.offsetHeight, visible: true });
  }, [top3ActiveIdx]);

  // Per-direction quality thresholds — must match AfrrDailyDirectionalBars
  // so the hover-day fingerprint line uses the same green/amber/red.
  const dirQuality = React.useMemo(() => {
    const posSorted = calendar.map(d => d.pos_daily_eur || 0).filter(v => v > 0).sort((a, b) => a - b);
    const negSorted = calendar.map(d => d.neg_daily_eur || 0).filter(v => v > 0).sort((a, b) => a - b);
    const q = (s, p) => s.length ? s[Math.max(0, Math.min(s.length - 1, Math.round(p * (s.length - 1))))] : 0;
    return {
      posP25: q(posSorted, 0.25), posP75: q(posSorted, 0.75),
      negP25: q(negSorted, 0.25), negP75: q(negSorted, 0.75),
    };
  }, [calendar]);
  const classify = (v, p25, p75) => {
    if (v == null || v <= 0) return null;
    if (v >= p75) return "GOOD";
    if (v >= p25) return "MID";
    return "SOFT";
  };
  const hoverPosQuality = hoverDayInfo
    ? classify(hoverDayInfo.pos_total, dirQuality.posP25, dirQuality.posP75)
    : null;
  const hoverNegQuality = hoverDayInfo
    ? classify(hoverDayInfo.neg_total, dirQuality.negP25, dirQuality.negP75)
    : null;

  // Lock fingerprint y-axis to the month-average range only (not the
  // hover-day peaks) so the typical curve doesn't get crushed by a
  // single high day. Hover-day overlay may clip — that's the signal.
  const fingerprintYMax = React.useMemo(() => {
    const vals = [];
    const push = arr => (arr || []).forEach(v => {
      if (v != null && !Number.isNaN(v)) vals.push(Math.abs(v));
    });
    push(tod.posMonth); push(tod.negMonth);
    const peak = Math.max(1, ...vals);
    const padded = peak * 1.2;
    const mag = Math.pow(10, Math.floor(Math.log10(padded)));
    const norm = padded / mag;
    let step = 1;
    if (norm > 5) step = 10;
    else if (norm > 2) step = 5;
    else if (norm > 1) step = 2;
    return step * mag;
  }, [tod]);

  return (
    <section id="sec-04" style={{ padding: "32px 40px 24px 40px" }}>
      <SectionHead num={3} title="Ancillary capacity" />
      <p style={{
        fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
        fontSize: 14, lineHeight: 1.5, color: T.body,
        margin: "0 0 22px 0", maxWidth: 900, textWrap: "pretty",
      }}>
        <Kk style={{ marginRight: 10 }}>In short</Kk>
        <span dangerouslySetInnerHTML={{ __html: c.capacitySummary || "" }} />
      </p>
      <div className="ed-cols-2" style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.6fr) minmax(0, 1fr)", gap: 36, alignItems: "start" }}>
        {/* ── Left column: daily bars + intraday fingerprint ── */}
        <div style={{ display: "flex", flexDirection: "column", gap: 28 }}>
          <Figure
            title="Daily capacity revenue · POS up, NEG down"
            sub={<>
              <span style={{ color: T.high, fontWeight: 700 }}>best days</span> ·{" "}
              <span style={{ color: T.amber, fontWeight: 700 }}>normal</span> ·{" "}
              <span style={{ color: T.low, fontWeight: 700 }}>weak</span>
              {" — colour = quality within each direction's own distribution. Position = direction (POS↑ / NEG↓). Top-3 per direction marked. Glyph below each day = regime."}
              {" · "}
              <span style={{
                display: "inline-block", width: 10, height: 10,
                background: T.tint, border: `1px solid ${T.line}`,
                verticalAlign: "-1px", marginRight: 4,
              }} />
              <span style={{ color: T.mute }}>weekend &amp; holiday</span>
            </>}
          >
            <AfrrDailyDirectionalBars
              days={calendar}
              holidays={a.holidays || []}
              hoverDay={hoverDay}
              onHover={setHoverDay}
              w={720} h={220}
            />
            <div style={{
              display: "flex", flexWrap: "wrap", alignItems: "center", gap: "6px 16px", marginTop: 8,
              fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: T.mute,
            }}>
              <Kk style={{ color: T.mute }}>Glyph</Kk>
              {CALENDAR_REGIME_LEGEND.map(({ glyph, label }) => (
                <span key={label} style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                  <span style={{ fontFamily: "'Source Serif 4', serif", color: T.body, fontSize: 13 }}>{glyph}</span>
                  {label}
                </span>
              ))}
            </div>
          </Figure>
          <Figure
            title="Intraday fingerprint · POS up, NEG down"
            right={<span style={{ display: "inline-flex", gap: 12 }}>
              <LegLine color={T.wh}   label={(c.month ? c.month.replace(/^(\w{3})\w*/, "$1") : "this-month") + " avg"} width={1.8} />
              <LegLine color={T.mute} label="1-year avg" dash="3 3" />
              {hoverDayInfo ? (
                <span style={{ display: "inline-flex", alignItems: "center", gap: 6,
                               fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5,
                               color: T.body, letterSpacing: "0.04em" }}>
                  <svg width={22} height={11} viewBox="0 0 22 11">
                    <line x1={1} y1={3} x2={21} y2={3}
                          stroke={AFRR_QUALITY_FILL[hoverPosQuality] || T.ink}
                          strokeWidth={2.4} strokeLinecap="round" />
                    <line x1={1} y1={8} x2={21} y2={8}
                          stroke={AFRR_QUALITY_FILL[hoverNegQuality] || T.ink}
                          strokeWidth={2.4} strokeLinecap="round" />
                  </svg>
                  {hoverDayInfo.dateLabel}
                </span>
              ) : (
                <LegLine color={T.mute} label="hover a day" width={1.8} />
              )}
            </span>}
          >
            <AfrrTodFingerprint
              posMonth={tod.posMonth || []}
              negMonth={tod.negMonth || []}
              posTrailing={tod.posTrailingP50 || null}
              negTrailing={tod.negTrailingP50 || null}
              hoverDayPosBlocks={hoverDayInfo?.pos_blocks || null}
              hoverDayNegBlocks={hoverDayInfo?.neg_blocks || null}
              hoverDayLabel={hoverDayInfo?.dateLabel || null}
              hoverPosQuality={hoverPosQuality}
              hoverNegQuality={hoverNegQuality}
              blockLabels={tod.blocks}
              yMaxOverride={fingerprintYMax}
              w={720} h={210}
            />
          </Figure>
        </div>
        {/* ── Right column: KPI tiles + Top-3 days ── */}
        <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 8 }}>
              <Kk>Key numbers</Kk>
              <CmpToggle mode={cmpMode} onSelect={onCmpSelect} />
            </div>
            <KpiGrid cols={1}>
              <AfrrDirectionTile card={leftTile} mode={cmpMode} />
              <AfrrDirectionTile card={rightTile} mode={cmpMode} />
            </KpiGrid>
          </div>
          {top3.length > 0 && (
            <div>
              <Kk style={{ display: "block", marginBottom: 8 }}>Top-3 days · driver</Kk>
              <div
                onMouseLeave={() => setHoverDay(null)}
                style={{ display: "flex", flexDirection: "column", gap: 6, position: "relative" }}>
                {top3Hl && (
                  <div aria-hidden style={{
                    position: "absolute", left: 0, right: 0,
                    top: top3Hl.top, height: top3Hl.height,
                    background: T.tint, borderRadius: 2, zIndex: 0,
                    opacity: top3Hl.visible ? 1 : 0,
                    pointerEvents: "none",
                    transition: "top 0.28s cubic-bezier(0.4,0,0.2,1), height 0.28s cubic-bezier(0.4,0,0.2,1), opacity 0.18s ease",
                  }} />
                )}
                {top3.map((d, i) => (
                  <div key={i}
                       ref={el => { top3RowRefs.current[i] = el; }}
                       onMouseEnter={() => setHoverDay(d.date)}
                       style={{
                         position: "relative", zIndex: 1,
                         display: "grid", gridTemplateColumns: "20px 80px 1fr auto",
                         gap: 8, alignItems: "baseline",
                         fontFamily: "'Inter', sans-serif", fontSize: 12, color: T.body,
                         cursor: "pointer",
                         padding: "2px 4px",
                         borderRadius: 2,
                       }}>
                    <span style={{
                      display: "inline-flex", alignItems: "center", justifyContent: "center",
                      width: 14, height: 14, borderRadius: 7,
                      background: T.ink, color: T.bg,
                      fontFamily: "'JetBrains Mono', monospace", fontSize: 9, fontWeight: 700,
                    }}>{i + 1}</span>
                    <Nm size={11} color={T.ink}>{d.label}</Nm>
                    <span style={{
                      fontStyle: d.driver && d.driver !== "—" ? "italic" : "normal",
                      color: d.driver && d.driver !== "—" ? T.body : T.mute,
                      fontFamily: "'Source Serif 4', serif", fontSize: 12.5,
                      overflow: "hidden", textOverflow: "ellipsis",
                    }}>{d.driver}</span>
                    <Nm size={11} color={T.mute}>{(d.share_pct ?? 0).toFixed(1)}%</Nm>
                  </div>
                ))}
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr auto",
                  gap: 10, alignItems: "baseline",
                  marginTop: 4, paddingTop: 6, borderTop: `1px solid ${T.lineSoft}`,
                }}>
                  <Kk style={{ fontSize: 9 }}>Top-3 share of month</Kk>
                  <Nm size={11.5} color={T.ink}>{(a.top3SharePct ?? 0).toFixed(0)}%</Nm>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
      <FcrStrip f={c.fcr} mode={cmpMode} />
      {/* ActivationStrip hidden — activation in 2025–26 regime sits at 1–7%
          of stack and the headline already covers it in §05 when material.
          Component kept (definition + builder pass-through) for future
          months where activation share crosses back above the floor. */}
      {/* <ActivationStrip a={c.activation} /> */}
    </section>
  );
};

// ── FCR sub-strip · folded into Sec04 since FCR is ~5–8% of stack and
// not every battery participates. Three indicators answer:
//   1. earning? (clearing vs YoY — same base as §03 aFRR cards)
//   2. market saturating? (oversupply RATIO vs 12-mo avg — a ratio, not a
//      price level, so recent-typical is the natural baseline, not YoY)
//   3. relevant? (share of stack vs 12-mo avg + € earned — likewise a share)
const FCR_REGISTER_LABEL = {
  "EXTREME": "exceptional",
  "HIGH": "firm",
  "NORMAL": "normal",
  "SOFT": "weak",
  "EXTREME-LOW": "very weak",
};

const FcrStrip = ({ f, mode }) => {
  // useTween must run unconditionally (before the early return) — morph the
  // clearing delta on a MoM↔YoY switch the same way the charts morph.
  const clrYoy = f ? (mode === "mom" ? f.clearingMomPct : f.clearingYoyPct) : null;
  const tClr = useTween(clrYoy);
  if (!f || f.clearing == null) return null;
  const regLabel = FCR_REGISTER_LABEL[f.register] || "normal";

  // Tile 1 — clearing vs the section's comparison base (YoY default, or MoM
  // via the §03 header CmpToggle), matching the aFRR cards so the whole
  // capacity section reads on one base. Tiles 2 & 3 are ratios/shares and stay
  // on the 12-mo average (not toggled).
  const clrCmpLabel = mode === "mom" ? f.clearingMomLabel : f.clearingYoyLabel;
  const clrDelta = clrYoy != null ? fmtDelta(tClr, 0) : null;
  const clrParts = [];
  if (clrYoy != null) clrParts.push(`vs ${clrCmpLabel}`);
  clrParts.push(regLabel);
  const clrContext = clrParts.join(" · ");
  const clrTone = clrYoy != null
    ? (clrYoy >= 5 ? "good" : clrYoy <= -5 ? "bad" : null)
    : null;

  // Tile 2 — pool over-bid (surplus relative to TSO demand). Verbal tag
  // is the readable cue; ratio alone is opaque to most readers.
  const osDelta = (f.oversupplyPct != null && f.oversupplyTrailing12Pct != null)
    ? f.oversupplyPct - f.oversupplyTrailing12Pct
    : null;
  const osTone = osDelta == null ? null
                : osDelta > 10 ? "warn"
                : osDelta < -10 ? "good"
                : null;
  const osSubParts = [];
  if (f.oversupplyTrailing12Pct != null) {
    osSubParts.push(`vs 12-mo avg ${f.oversupplyTrailing12Pct.toFixed(0)}%`);
  }
  if (f.poolLabel) osSubParts.push(f.poolLabel);

  // Tile 3 — share of total LP revenue.
  const shareNum = Number(f.stackShare || 0);
  const shareSubParts = [];
  if (f.stackShareTrailing12 != null) {
    shareSubParts.push(`vs 12-mo avg ${f.stackShareTrailing12.toFixed(1)}%`);
  }
  if (f.revenueKEurPerMw != null) {
    shareSubParts.push(`€${f.revenueKEurPerMw.toFixed(1)}k/MW earned`);
  }

  return (
    <div style={{ marginTop: 32, paddingTop: 22, borderTop: `1px solid ${T.lineSoft}` }}>
      <div style={{ marginBottom: 10 }}>
        <Kk>FCR · capacity</Kk>
      </div>
      <KpiGrid cols={3}>
        <KpiCell
          label="Auction clearing"
          value={`€${(f.clearing || 0).toFixed(1)}`}
          unit="/MW/h"
          delta={clrDelta}
          sub={clrContext}
          tone={clrTone}
        >
          <MiniSparkline values={f.trend} />
        </KpiCell>
        <KpiCell
          label="Pool over-bid"
          value={f.oversupplyPct != null ? `${f.oversupplyPct.toFixed(0)}%` : "—"}
          unit="more bids than demand"
          sub={osSubParts.join(" — ") || "—"}
          tone={osTone}
        >
          <SaturationGauge now={f.oversupplyPct} anchor={f.oversupplyTrailing12Pct} />
        </KpiCell>
        <KpiCell
          label="Share of stack"
          value={`${shareNum.toFixed(1)}`}
          unit="%"
          sub={shareSubParts.join(" · ") || "this month"}
        >
          <ShareTrendBars values={f.stackShareTrend} />
        </KpiCell>
      </KpiGrid>
    </div>
  );
};

// ── Activation sub-strip · folded into Sec04 since balancing-energy
// activation is ~1–7% of stack in the 2025–2026 regime but historically
// has been 10–23% (Dec 2024). Three tiles answer:
//   1. earning? (revenue + share vs trail-12, with 12-mo sparkline)
//   2. how called? (util + POS/NEG split)
//   3. who shaped it? (single top event of the month)
// Full §05 (KPI grid + top-3 events table) auto-expands only when
// util ≥ 10 or share ≥ 10 — see Sec05 invocation in app.jsx.

// ── Mini visual atoms shared by FcrStrip / ActivationStrip ──────
// All sized to live in a KpiCell's `children` slot under the
// number+sub line. None take more than ~24px of vertical room.

// 12-point sparkline (last 12 monthly values). End-point dot picks
// the eye to "now". Used in both Revenue and Auction-clearing tiles.
const MiniSparkline = ({ values, w = 88, h = 22 }) => {
  if (!values || values.length === 0) return null;
  const max = Math.max(1, ...values);
  const step = w / Math.max(1, values.length - 1);
  const pts = values.map((v, i) => `${(i * step).toFixed(1)},${(h - (v / max) * h).toFixed(1)}`).join(" ");
  const lastX = (values.length - 1) * step;
  const lastY = h - (values[values.length - 1] / max) * h;
  return (
    <svg width={w} height={h} style={{ display: "block", marginTop: 4 }}>
      <polyline points={pts} fill="none" stroke={T.body} strokeWidth={1} opacity={0.55} />
      <circle cx={lastX} cy={lastY} r={2} fill={T.ink} />
    </svg>
  );
};

// Saturation gauge — horizontal three-zone bar (scarce | competitive /
// softening | flooded). Filled dot = this month, hollow ring = trail-12.
// Domain runs from -25 % (scarce) to +75 % (flooded); positions clamp.
const SaturationGauge = ({ now, anchor, w = 124, h = 8 }) => {
  if (now == null) return null;
  const lo = -25, hi = 75;
  const x = (v) => Math.max(2, Math.min(w - 2, ((v - lo) / (hi - lo)) * w));
  const zoneEnd = (boundary) => ((boundary - lo) / (hi - lo)) * w;
  const x0 = zoneEnd(0);     // scarce → competitive
  const x50 = zoneEnd(50);   // softening → flooded
  return (
    <svg width={w} height={h + 6} style={{ display: "block", marginTop: 6, overflow: "visible" }}>
      <rect x={0}   y={0} width={x0}        height={h} fill={T.high}  opacity={0.20} />
      <rect x={x0}  y={0} width={x50 - x0}  height={h} fill={T.amber} opacity={0.20} />
      <rect x={x50} y={0} width={w - x50}   height={h} fill={T.low}   opacity={0.22} />
      <line x1={x0}  y1={0} x2={x0}  y2={h} stroke={T.line} strokeWidth={0.6} />
      <line x1={x50} y1={0} x2={x50} y2={h} stroke={T.line} strokeWidth={0.6} />
      {anchor != null && (
        <circle cx={x(anchor)} cy={h / 2} r={3} fill="none" stroke={T.mute} strokeWidth={1} />
      )}
      <circle cx={x(now)} cy={h / 2} r={3} fill={T.ink} />
    </svg>
  );
};

// 12-bar mini histogram, last bar emphasised. Used for FCR share-of-stack
// trend; conceptually a bar version of MiniSparkline.
const ShareTrendBars = ({ values, w = 88, h = 22 }) => {
  if (!values || values.length === 0) return null;
  const max = Math.max(1e-3, ...values);
  const n = values.length;
  const gap = 1;
  const bw = Math.max(2, (w - gap * (n - 1)) / n);
  return (
    <svg width={w} height={h} style={{ display: "block", marginTop: 4 }}>
      {values.map((v, i) => {
        const bh = Math.max(0.5, (v / max) * h);
        const x = i * (bw + gap);
        const y = h - bh;
        const isLast = i === n - 1;
        return (
          <rect
            key={i}
            x={x}
            y={y}
            width={bw}
            height={bh}
            fill={isLast ? T.fcr : T.body}
            opacity={isLast ? 1 : 0.45}
          />
        );
      })}
    </svg>
  );
};

// Two thin stacked horizontal bars (up / down) showing POS vs NEG
// utilisation in proportion. Scale is symmetric — both bars share the
// same axis, picked from the larger of (pos, neg, 5) so small months
// still register visually.
const SplitBar = ({ pos, neg, w = 124 }) => {
  if (pos == null && neg == null) return null;
  const p = Math.max(0, pos || 0);
  const n = Math.max(0, neg || 0);
  const scale = Math.max(p, n, 5);
  const bh = 5;
  const labelW = 22;
  const barW = w - labelW;
  const pw = (p / scale) * barW;
  const nw = (n / scale) * barW;
  const labelStyle = {
    fontFamily: "'JetBrains Mono', monospace",
    fontSize: 8, fill: T.mute, letterSpacing: "0.06em",
  };
  return (
    <svg width={w} height={bh * 2 + 6} style={{ display: "block", marginTop: 6 }}>
      <text x={0} y={bh - 0.5} {...labelStyle}>UP</text>
      <rect x={labelW} y={0} width={barW} height={bh} fill={T.lineSoft} />
      <rect x={labelW} y={0} width={pw}   height={bh} fill={T.high} opacity={0.75} />
      <text x={0} y={bh * 2 + 5} {...labelStyle}>DN</text>
      <rect x={labelW} y={bh + 2} width={barW} height={bh} fill={T.lineSoft} />
      <rect x={labelW} y={bh + 2} width={nw}   height={bh} fill={T.low}  opacity={0.75} />
    </svg>
  );
};

// One-line proportion bar showing the top event's share of monthly MWh.
// Tone goes accent at ≥30 % concentration (i.e. a real spike); neutral
// below. The percentage is rendered inline.
const TopEventShareBar = ({ share, w = 124 }) => {
  if (share == null) return null;
  const pct = Math.max(0, Math.min(1, share));
  const fill = pct >= 0.30 ? T.accent : T.body;
  const bh = 5;
  const barW = w - 30;
  return (
    <svg width={w} height={bh + 6} style={{ display: "block", marginTop: 6 }}>
      <rect x={0} y={2} width={barW} height={bh} fill={T.lineSoft} />
      <rect x={0} y={2} width={barW * pct} height={bh} fill={fill} opacity={0.85} />
      <text
        x={barW + 4}
        y={bh + 4}
        style={{
          fontFamily: "'JetBrains Mono', monospace",
          fontSize: 9, fill: T.mute,
          letterSpacing: "0.04em",
        }}
      >{Math.round(pct * 100)}%</text>
    </svg>
  );
};

const ActivationStrip = ({ a }) => {
  if (!a || a.revenue == null) return null;

  // Tile 1 — revenue + share with trailing-12 anchor + sparkline. Lets
  // the reader place this month's 2% next to the 4% trail-12 mean so the
  // smallness reads as "current regime", not "always tiny".
  const shareNum = a.share != null ? Number(a.share) : null;
  const trailNum = a.shareTrail12 != null ? Number(a.shareTrail12) : null;
  const subParts1 = [];
  if (shareNum != null) subParts1.push(`${shareNum.toFixed(1)}% share`);
  if (trailNum != null) subParts1.push(`trail-12 ${trailNum.toFixed(1)}%`);

  // Tile 2 — utilisation with POS / NEG split inline. Tone warns when
  // utilisation crosses the "activation hot" threshold the hero copy
  // also keys off.
  const utilTone = a.util >= 10 ? "warn" : null;
  const utilSub = `up ${(a.posU || 0).toFixed(1)}% · down ${(a.negU || 0).toFixed(1)}%`;

  // Tile 3 — single biggest event of the month. Skip the table; in a
  // light month one row carries the story. The dir+MWh sub-line gives
  // the magnitude; an additional LLM-written caption narrates *why*.
  const ev = a.topEvent;
  const evValue = ev ? `${ev.date}` : "—";
  const evSub = ev
    ? `${ev.dir} · ${ev.totalMwh.toLocaleString()} MWh`
    : "no called events this month";
  const evCaption = ev && ev.shortCaption ? ev.shortCaption : null;

  return (
    <div style={{ marginTop: 32, paddingTop: 22, borderTop: `1px solid ${T.lineSoft}` }}>
      <div style={{ marginBottom: 10 }}>
        <Kk>Activation · balancing energy</Kk>
      </div>
      <KpiGrid cols={3}>
        <KpiCell
          label="Revenue"
          value={`€${(a.revenue || 0).toLocaleString()}`}
          unit="/MW"
          sub={subParts1.join(" · ") || "this month"}
        >
          <MiniSparkline values={a.spark || []} />
        </KpiCell>
        <KpiCell
          label="Utilisation"
          value={(a.util || 0).toFixed(1)}
          unit="%"
          sub={utilSub}
          tone={utilTone}
        >
          <SplitBar pos={a.posU} neg={a.negU} />
        </KpiCell>
        <KpiCell
          label="Top event"
          value={evValue}
          unit=""
          sub={evSub}
        >
          {ev && a.topEventShare != null && (
            <TopEventShareBar share={a.topEventShare} />
          )}
          {evCaption && (
            <div style={{
              marginTop: 4,
              fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
              fontSize: 12, lineHeight: 1.4, color: T.body,
              maxWidth: 240,
            }}>
              {evCaption}
            </div>
          )}
        </KpiCell>
      </KpiGrid>
    </div>
  );
};

// ── § 08 Forward catalysts ──────────────────────────────────────
const ImpactBar = ({ lo, hi, max = 4.5, height = 10 }) => {
  const negSide = lo < 0;
  const absLo = Math.abs(lo), absHi = Math.abs(hi);
  const left  = negSide ? `${50 - absLo / max * 50}%` : "50%";
  const width = `${(absHi - absLo) / max * 50}%`;
  const color = negSide ? T.low : T.high;
  return (
    <div style={{ position: "relative", height, background: "var(--ink-overlay)", borderRadius: 2 }}>
      <div style={{ position: "absolute", left: "50%", top: -2, bottom: -2, width: 1, background: T.ink, opacity: 0.5 }} />
      <div style={{ position: "absolute", top: 0, bottom: 0, left, width, background: color, opacity: 0.85, borderRadius: 1 }} />
    </div>
  );
};

        remain wired; to un-hide, restore:
        <BessPipelineBlock pipeline={c.bessPipeline} /> */}
  </section>
);

const BessPipelineBlock = ({ pipeline }) => {
  if (!pipeline || !(pipeline.bars && pipeline.bars.length)) return null;
  const bars = pipeline.bars;
  const nepAtEnd = pipeline.nepAtEndMw;

  // Y-axis: nice ceiling across all bars + NEP curve.
  const peakBar = bars.reduce((m, b) => Math.max(m, b.mw || 0), 0);
  const peakNep = bars.reduce((m, b) => Math.max(m, b.nepMw || 0), 0);
  const peak = Math.max(1, peakBar, peakNep) * 1.12;
  const mag = Math.pow(10, Math.floor(Math.log10(peak)));
  const norm = peak / mag;
  let step = 1;
  if (norm > 5) step = 10;
  else if (norm > 2) step = 5;
  else if (norm > 1) step = 2;
  const yMax = step * mag;

  const w = 720, h = 160;
  const padL = 36, padR = 90, padT = 8, padB = 22;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const xStep = innerW / bars.length;
  const barW = Math.min(xStep * 0.62, 40);
  const yScale = (v) => padT + innerH - (v / yMax) * innerH;

  const ticks = [0, yMax / 2, yMax];
  const cohortColor = (c) => (c === "realised" ? T.ink : T.mute);

  // NEP polyline points across bar centres.
  const nepPoints = bars
    .map((b, i) => (b.nepMw == null ? null : `${padL + i * xStep + xStep / 2},${yScale(b.nepMw)}`))
    .filter(Boolean)
    .join(" ");

  const fmtGw = (mw) => (mw / 1000).toFixed(2);

  return (
    <div style={{ marginTop: 28, paddingTop: 18, borderTop: `1px solid ${T.lineSoft}` }}>
      <div style={{
        display: "flex", alignItems: "baseline", justifyContent: "space-between",
        marginBottom: 10, gap: 18, flexWrap: "wrap",
      }}>
        <Kk>BESS pipeline · operational MW by quarter</Kk>
        <div style={{
          display: "flex", gap: 22, alignItems: "baseline",
          fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: T.body,
        }}>
          <span>
            <Kk style={{ marginRight: 6 }}>Operational today</Kk>
            <Nm size={12} color={T.ink}>{fmtGw(pipeline.operationalMw)} GW</Nm>
          </span>
          <span>
            <Kk style={{ marginRight: 6 }}>End {bars[bars.length - 1].q}</Kk>
            <Nm size={12} color={T.ink}>{fmtGw(pipeline.endOfWindowMw)} GW</Nm>
          </span>
          {nepAtEnd != null && (
            <span>
              <Kk style={{ marginRight: 6 }}>Central scenario</Kk>
              <Nm size={12} color={T.body}>{fmtGw(nepAtEnd)} GW</Nm>
            </span>
          )}
        </div>
      </div>
      <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
        {/* Gridlines + Y-axis ticks */}
        {ticks.map((t, i) => (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={yScale(t)} y2={yScale(t)}
                  stroke={t === 0 ? T.line : T.lineSoft}
                  strokeWidth={t === 0 ? 1 : 0.5}
                  strokeDasharray={t === 0 ? "none" : "2 4"} />
            <text x={padL - 6} y={yScale(t) + 3} textAnchor="end"
                  fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>
              {(t / 1000).toFixed(1)}
            </text>
          </g>
        ))}
        <text x={padL - 6} y={padT + 8} textAnchor="end"
              fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>
          GW
        </text>
        {/* Realised / planned divider */}
        {(() => {
          const splitIdx = bars.findIndex((b) => b.cohort === "planned");
          if (splitIdx <= 0) return null;
          const x = padL + splitIdx * xStep;
          return (
            <g>
              <line x1={x} x2={x} y1={padT} y2={padT + innerH}
                    stroke={T.mute} strokeWidth={1} strokeDasharray="3 3"
                    opacity={0.55} />
              <text x={x - 4} y={padT + 8} textAnchor="end"
                    fontFamily="'JetBrains Mono', monospace" fontSize={9}
                    fontWeight={600} fill={T.mute}>realised</text>
              <text x={x + 4} y={padT + 8} textAnchor="start"
                    fontFamily="'JetBrains Mono', monospace" fontSize={9}
                    fontWeight={600} fill={T.mute}>projected</text>
            </g>
          );
        })()}
        {/* Bars */}
        {bars.map((b, i) => {
          const x = padL + i * xStep + (xStep - barW) / 2;
          const y = yScale(b.mw);
          const bh = padT + innerH - y;
          const isPlanned = b.cohort === "planned";
          return (
            <g key={b.q}>
              <rect x={x} y={y} width={barW} height={Math.max(bh, 0)}
                    fill={cohortColor(b.cohort)}
                    opacity={isPlanned ? 0.55 : 0.92} />
              {b.mw > 0 && (
                <text x={x + barW / 2} y={y - 3} textAnchor="middle"
                      fontFamily="'JetBrains Mono', monospace" fontSize={9}
                      fill={T.body}>
                  {fmtGw(b.mw)}
                </text>
              )}
              <text x={padL + i * xStep + xStep / 2} y={h - padB + 14}
                    textAnchor="middle"
                    fontFamily="'JetBrains Mono', monospace" fontSize={10}
                    fill={T.body}>
                {b.q}
              </text>
            </g>
          );
        })}
        {/* Central scenario trajectory — polyline across quarter midpoints */}
        {nepPoints && (
          <g>
            <polyline points={nepPoints}
                      fill="none" stroke={T.acap}
                      strokeWidth={1.4} strokeDasharray="5 4" />
            {bars.map((b, i) => b.nepMw != null && (
              <circle key={`central-${i}`} cx={padL + i * xStep + xStep / 2}
                      cy={yScale(b.nepMw)} r={2.2}
                      fill={T.acap} />
            ))}
            {nepAtEnd != null && (
              <text x={padL + (bars.length - 1) * xStep + xStep / 2 + 6}
                    y={yScale(nepAtEnd) + 3} textAnchor="start"
                    fontFamily="'JetBrains Mono', monospace" fontSize={10}
                    fill={T.acap} fontWeight={600}>
                Central scenario
              </text>
            )}
          </g>
        )}
      </svg>
      <div style={{
        fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
        fontSize: 11.5, color: T.mute, marginTop: 6, lineHeight: 1.4,
      }}>
        Cumulative utility-scale BESS MW operational at quarter-end. Realised
        bars (left of divider) sum MaStR actual-COD units to date; projected
        bars (right) add MaStR planned-COD units due between today and that
        quarter-end on top of today's fleet.
        {pipeline.overdueMw && pipeline.overdueMw > 0
          ? ` ${Math.round(pipeline.overdueMw)} MW of planned with overdue planned_cod sit outside the projection — paperwork lag or genuine slip, ambiguous from MaStR.`
          : ""}
        {pipeline.asOf ? ` Snapshot ${pipeline.asOf}.` : ""}
      </div>
    </div>
  );
};

      borderBottom: `1px solid ${T.line}`,
    }}>
      {/* LEFT COLUMN — verdict cluster → lede → Key takeaways */}
      <div>
        <Kk color={T.accent} style={{ fontSize: 11, letterSpacing: "0.18em" }}>{c.verdictKicker || "The verdict"}</Kk>
        <h1 style={{
          fontFamily: "'Source Serif 4', Charter, Georgia, serif",
          fontSize: 56, fontWeight: 700, lineHeight: 1.05,
          color: T.ink, margin: "12px 0 18px 0",
          letterSpacing: "-0.025em", textWrap: "balance", maxWidth: 720,
        }}>{c.verdictPhrase}.</h1>
        {c.heroSubtitle && (
          <p style={{
            fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
            // maxWidth bumped 540 → 600 so the typical two-sentence
            // subtitle fits on two lines without a single-word orphan
            // ("sharply." dropping alone to line 3). The Apr-2026 copy
            // line 2 already runs 507 px and adds " sharply." (62 px)
            // — 540 couldn't accommodate, 600 can. Still narrower than
            // the h1 above (720) so visual hierarchy is preserved.
            // `text-wrap: pretty` kept as a belt-and-braces hint for
            // future months where the copy length lands at edge cases.
            fontSize: 17, lineHeight: 1.5, color: T.body,
            margin: 0, maxWidth: 600, letterSpacing: "-0.005em",
            textWrap: "pretty",
          }}>
            {c.heroSubtitle}
          </p>
        )}
        <div style={{ marginTop: 28, paddingTop: 16, borderTop: `1px solid ${T.lineSoft}` }}>
          <Kk style={{ fontSize: 10 }}>Key takeaways</Kk>
          <ul style={{ listStyle: "none", margin: "12px 0 0 0", padding: 0, display: "flex", flexDirection: "column", gap: 8 }}>
            {(c.insights || []).slice(0, 3).map((line, i) => (
              <li key={i} style={{
                display: "grid", gridTemplateColumns: "26px 1fr", gap: 12,
                alignItems: "flex-start",
                fontFamily: "'Inter', sans-serif", fontSize: 13, lineHeight: 1.5,
                color: T.body, maxWidth: 620,
              }}>
                <Nm size={11} color={T.accent} style={{ paddingTop: 3 }}>{String(i + 1).padStart(2, "0")}</Nm>
                <span style={{ textWrap: "pretty" }}>{line}</span>
              </li>
            ))}
          </ul>
        </div>
      </div>

      {/* RIGHT COLUMN — paired number (uncarded) → CARD with
          Per-stream share + FY pace. Variant B layout: big number stays
          uncarded to align with the verdict on the left; the secondary
          detail sits in card chrome so it doesn't compete. */}
      <div>
        <div>
          <Kk style={{ fontSize: 10 }}>Total stack · benchmark</Kk>
          <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginTop: 6 }}>
            <Nm size={56} style={{ /* override at mobile via .ed-hero-bignum */ }}><span className="ed-hero-bignum">{(c.totalActual / 1000).toFixed(1)}</span></Nm>
            <Nm size={14} color={T.mute} weight={500}>k€/MW</Nm>
          </div>
          <div style={{
            fontFamily: "'JetBrains Mono', monospace",
            fontSize: 12, fontWeight: 700,
            marginTop: 6, letterSpacing: "0.02em",
          }}>
            <span style={{ color: deltaTone }}>{deltaPct}</span>
            {deltaPct && prevMonth && <span style={{ color: T.mute, fontWeight: 500 }}> vs {prevMonth}</span>}
          </div>
        </div>

        <div style={{
          marginTop: 22,
          padding: "18px 20px",
          background: T.card,
          border: `1px solid ${T.line}`,
          borderRadius: 4,
        }}>
          <Kk style={{ fontSize: 10 }}>Per-stream share · this month</Kk>
          <div style={{ marginTop: 10 }}>
            <div style={{ display: "flex", height: 12, borderRadius: 2, overflow: "hidden", border: `1px solid ${T.line}` }}>
              {c.status.map(s => (
                <div key={s.id} style={{ flex: s.share, background: STREAMS[s.id].color, opacity: 0.92 }} title={`${STREAMS[s.id].name}: ${s.share}%`} />
              ))}
            </div>
            {/* Column-major flow so the two majors (Wholesale + aFRR capacity)
                read together down the LEFT column, the two small streams (FCR +
                aFRR energy) down the right — without reordering the bar above
                (which keeps Wholesale and aFRR capacity adjacent). Full names
                ("aFRR capacity"/"aFRR energy"), not the "cap"/"eng" shorts. */}
            <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gridTemplateRows: "repeat(2, auto)", gridAutoFlow: "column", columnGap: 22, rowGap: 6 }}>
              {c.status.map(s => (
                <div key={s.id} style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: "'Inter', sans-serif", fontSize: 11.5, color: T.body }}>
                  <Dot color={STREAMS[s.id].color} size={7} />
                  <span>{STREAMS[s.id].name}</span>
                  <Nm size={11} color={T.mute}>{s.share}%</Nm>
                </div>
              ))}
            </div>
          </div>

          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.lineSoft}` }}>
            <Kk style={{ fontSize: 10 }}>If this pace held all year</Kk>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4, marginTop: 4 }}>
              <Nm size={22}>{fy.value || "—"}</Nm>
              <Nm size={11} color={T.mute} weight={500}>/MW/yr</Nm>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

const PageFooter = ({ meta }) => (
  <footer style={{
    padding: "20px 40px 28px 40px",
    borderTop: `1.5px solid ${T.ink}`,
    background: T.tint,
    marginTop: 16,
  }}>
    {/* What the revenue numbers are — a benchmark, not a single operator's
        realised P&L. Leads the footer; the colophon line sits below it. */}
    <div style={{
      fontFamily: "'Inter', system-ui, sans-serif", fontSize: 11,
      color: T.mute, lineHeight: 1.55, maxWidth: 820,
      marginBottom: 12, paddingBottom: 12, borderBottom: `1px solid ${T.lineSoft}`,
    }}>
      <span style={{ fontWeight: 700, color: T.body }}>About the benchmark.</span>{" "}
      Revenue is modelled for a <b>neutral 2-hour German battery</b> — co-optimised
      across day-ahead, intraday, aFRR (capacity + energy) and FCR on realised market
      prices. It tracks what a representative asset could earn, not the realised
      P&amp;L of any single operator.
    </div>
    <div className="ed-pagefooter-row" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: T.mute, letterSpacing: "0.04em" }}>
      <span>Monthly Note · No. {meta.noteNumber ?? "—"} · Germany · last refresh {meta.refresh || "—"}</span>
      <span>
        © {meta.year || new Date().getFullYear()} Anton Telegin
        {" · "}Questions or feedback?{" "}
        <a href="https://www.linkedin.com/in/atelegin/" target="_blank" rel="noopener noreferrer" style={{ color: "inherit", textDecoration: "underline" }}>message me on LinkedIn</a>
        {" · "}Data open source, MIT-licensed
      </span>
    </div>
  </footer>
);

const EdV2App = ({ months, defaultKey, meta }) => {
  const [selectedKey, setSelectedKey] = React.useState(defaultKey);
  // Switching month swaps the LLM copy (hero subtitle, the "In short"
  // blocks), whose line counts differ month to month. A 2→3-line change
  // above the fold shifts everything below, so the page appears to jump.
  // Anchor the section sitting under the sticky masthead, then restore its
  // screen position after the re-render so the reader stays put. (Skipped
  // when no section is under the masthead yet — i.e. still in the hero —
  // so the top of the page just stays at the top.)
  const scrollAnchor = React.useRef(null);
  const handleSelect = React.useCallback((newKey) => {
    const bar = document.querySelector(".ed-topbar");
    const probeY = (bar ? bar.getBoundingClientRect().height : 0) + 4;
    let anchor = null;
    for (const s of document.querySelectorAll(".ed-page section[id]")) {
      const r = s.getBoundingClientRect();
      if (r.top <= probeY && r.bottom > probeY) { anchor = { id: s.id, top: r.top }; break; }
    }
    scrollAnchor.current = anchor;
    setSelectedKey(newKey);
  }, []);
  React.useLayoutEffect(() => {
    const a = scrollAnchor.current;
    scrollAnchor.current = null;
    if (!a) return;
    const el = document.getElementById(a.id);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - a.top);
  }, [selectedKey]);

  // Cross-month fade is a PURE-CSS keyframe (.ed-month-fade) replayed by
  // remounting the content via key={selectedKey} below — not a JS rAF/opacity
  // dance. The JS version looked instant (a synchronous 0→1 in a layout effect
  // never paints the 0 state, so the transition doesn't start) and, worse,
  // could leave the content stuck invisible if rAF stalled. cmpMode lives
  // ABOVE this subtree, so a MoM/YoY toggle does NOT change the key (no
  // re-fade); section-local chartView/paceMode reset to defaults on a month
  // change, which is fine for a fresh month view.

  // Comparison base (YoY default | MoM) is shared across §02 + §03 so the
  // whole issue reads on one base — toggling either section flips both.
  const [cmpMode, setCmpMode] = React.useState("yoy");

  const current = months[selectedKey];
  if (!current) {
    return <div style={{ padding: 40 }}>No data for month <code>{selectedKey}</code>.</div>;
  }
  return (
    <div className="ed-page">
      <TopBar months={months} selectedKey={selectedKey} onSelect={handleSelect} />
      <div className="ed-months ed-month-fade" key={selectedKey}>
      <Hero c={current} />
      <Sec01 c={current} />
      <Sec03 c={current} cmpMode={cmpMode} onCmpSelect={setCmpMode} />
      <Sec04 c={current} cmpMode={cmpMode} onCmpSelect={setCmpMode} />
      {/* Dynamic numbering — Sec05 (activation) only renders on heavy
          months, so the next section's §-number reflects what actually
          rendered above it (no "§04 → §06" gaps). */}
      {(() => {
        const activationVisible = !!(
          current.activation && (
            (current.activation.util ?? 0) >= 10
            || (current.activation.share ?? 0) >= 10
          )
        );
        let n = 3;  // Sec01 + Wholesale + Ancillary always render
        const sec05Num = activationVisible ? ++n : null;
        const sec06Num = ++n;
        return (
          <>
            {activationVisible && <Sec05 c={current} num={sec05Num} />}
            <Sec06 c={current} num={sec06Num} />
          </>
        );
      })()}
      </div>
      <PageFooter meta={meta} />
    </div>
  );
};

// Mount
const __D = window.__DATA__ || { months: {}, defaultKey: null, meta: {} };
ReactDOM.createRoot(document.getElementById("root")).render(
  <EdV2App months={__D.months} defaultKey={__D.defaultKey} meta={__D.meta} />
);
</script>
</body>
</html>
