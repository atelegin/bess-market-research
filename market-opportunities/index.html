// ── Delta sub-line helpers (shared standard) ────────────────────
// One template across every "vs" sub-line:
//   [delta]  vs [period] [baseline?]  — [qualifier?]
// Hierarchy: value = anchor (its own tone colour), delta = SEMANTIC
// colour (green up / coral down) + bold, context = muted italic. A
// neutral delta (no sign) renders muted — no direction, no colour.

// Signed-delta string with a typographic minus: "+19%" / "−28%".
const fmtDelta = (v, d = 0) => (v == null || isNaN(v))
  ? "" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + "%";

// Semantic colour for a signed-delta string: + → green, − → coral,
// otherwise muted (neutral / unsigned).
const deltaColorFor = (s) => {
  if (typeof s !== "string" || !s) return T.mute;
  const c = s.trim()[0];
  if (c === "+") return T.high;
  if (c === "-" || c === "−") return T.low;
  return T.mute;
};

// Standard delta + context sub-line. `delta` colours by sign and goes

            flexShrink: 0, alignSelf: "center",

// menu, both governed by the article tokens. `options` is a list of
// { value, label, disabled? }. Closes on outside-click, Escape, or
// selection.
const EdSelect = ({ value, options, onChange, ariaLabel, align = "left" }) => {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDoc);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);
  const selected = options.find(o => o.value === value) || options[0];
  return (
    <div ref={ref} className="ed-select-wrap">
      <button
        type="button"
        className="ed-select-btn"
        aria-label={ariaLabel}
        aria-haspopup="listbox"
        aria-expanded={open}
        onClick={() => setOpen(o => !o)}
      >
        <span>{selected ? selected.label : ""}</span>
        <svg className={"ed-select-caret" + (open ? " is-open" : "")} width="8" height="5" viewBox="0 0 8 5" aria-hidden="true">
          <path d="M0 0h8L4 5z" />
        </svg>
      </button>
      {open && (
        <ul className="ed-select-menu" role="listbox" style={{ [align]: 0 }}>
          {options.map(o => {
            const isSel = o.value === value;
            return (
              <li
                key={o.value}
                role="option"
                aria-selected={isSel}
                aria-disabled={o.disabled || undefined}
                className={"ed-select-opt" + (o.disabled ? " is-disabled" : "") + (isSel ? " is-selected" : "")}
                onClick={() => {
                  if (o.disabled) return;
                  if (o.value !== value) onChange(o.value);
                  setOpen(false);
                }}
              >
                <span className="ed-select-check" aria-hidden="true">{isSel ? "✓" : ""}</span>
                <span>{o.label}</span>
              </li>
            );
          })}
        </ul>
      )}
    </div>
  );
};

/* ── charts.jsx ── */
/* Editorial Dashboard v2 — chart library. */

// ── Helpers ─────────────────────────────────────────────────────
const niceMax = (v) => {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  const step = n < 1.2 ? 1.2 : n < 2 ? 2 : n < 3 ? 3 : n < 5 ? 5 : n < 8 ? 8 : 10;
  return step * p;
};

// ── Smooth value morphing ───────────────────────────────────────
// Every value-reading chart here is drawn on a fixed-x grid (24 hours,
// 6 blocks, N days/months) with a y-scale derived from the data. So when
// the underlying numbers change — annualisation toggle, YoY toggle, a
// new hovered day — interpolating the value arrays element-wise tweens
// the curve (and its rescaling axis) from the old shape into the new one
// rather than snapping. `useTween` drives that interpolation off rAF.
const TWEEN_MS = 300;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// Structure-preserving numeric lerp. Numbers blend; arrays/objects recurse.
// Anything non-numeric or shape-mismatched (different lengths, null gaps,
// strings) snaps at the midpoint instead of blending — keeps categorical
// data and missing blocks honest while the numbers around them morph.
const lerpVal = (a, b, t) => {
  if (a === b) return b;
  if (a == null || b == null) return t < 0.5 ? a : b;
  if (typeof a === "number" && typeof b === "number") {
    if (isNaN(a) || isNaN(b)) return t < 0.5 ? a : b;
    return a + (b - a) * t;
  }
  if (Array.isArray(a) && Array.isArray(b)) {
    if (a.length !== b.length) return t < 0.5 ? a : b;
    return a.map((v, i) => lerpVal(v, b[i], t));
  }
  if (typeof a === "object" && typeof b === "object") {
    const out = {};
    for (const k in b) out[k] = lerpVal(a[k], b[k], t);
    return out;
  }
  return t < 0.5 ? a : b;
};

// Returns a value that animates toward `target` over `ms`. Gated on
// reference identity: callers pass stable refs (memoised slices, index
// lookups) that only change on a real toggle/hover, so steady re-renders
// don't restart the animation.
const useTween = (target, ms = TWEEN_MS) => {
  const [val, setVal] = React.useState(target);
  const fromRef = React.useRef(target);
  const rafRef = React.useRef(null);
  React.useEffect(() => {
    const from = fromRef.current;
    if (from === target) { setVal(target); return; }
    const start = performance.now();
    let done = false;
    // Always reaches the target, even where rAF is paused (backgrounded
    // tab, headless render) — the setTimeout settle is the floor; rAF just
    // fills in the smooth intermediate frames when the tab is live.
    const finish = () => { if (!done) { done = true; setVal(target); fromRef.current = target; } };
    const tick = (now) => {
      const p = Math.min(1, (now - start) / ms);
      if (p >= 1) { finish(); return; }
      setVal(lerpVal(from, target, easeInOut(p)));
      rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    const settle = setTimeout(finish, ms + 60);
    return () => { cancelAnimationFrame(rafRef.current); clearTimeout(settle); };
  }, [target, ms]);
  return val;
};

// ── Uniform hover treatment (crosshair + value) ─────────────────
// One pattern across every value-reading chart. Hover snaps to the
// chart's atomic unit (day / 4-h block / hour); we draw a thin dashed
// vertical line at its x, a dot on the focused point, and ONE number
// near the dot in mono with a white text-stroke for readability. No
// deltas, no percentiles, no boxed tooltips — the reader is reading,
// not drilling.
const HoverLine = ({ x, y0, y1, opacity = 0.4 }) => (
  <line x1={x} y1={y0} x2={x} y2={y1}
        stroke={T.ink} strokeWidth={0.6}
        strokeDasharray="2 3" opacity={opacity}
        pointerEvents="none" />
);

const HoverDot = ({ x, y, color = T.ink, r = 3.4 }) => (
  <circle cx={x} cy={y} r={r} fill={color}
          stroke={T.bg} strokeWidth={1.2}
          pointerEvents="none" />
);

// `place`: "above" (default) | "below" | "right" | "left".
// `x1`/`x2` clamp the label so it stays inside the plot bounds.
const HoverValueLabel = ({ x, y, text, place = "above", x1, x2, color = T.ink }) => {
  let tx = x, ty = y, anchor = "middle";
  if (place === "above")      { ty = y - 8; }
  else if (place === "below") { ty = y + 16; }
  else if (place === "right") { tx = x + 8; ty = y - 4; anchor = "start"; }
  else if (place === "left")  { tx = x - 8; ty = y - 4; anchor = "end"; }
  if (x1 != null && x2 != null) {
    const approxHalf = (String(text).length * 6.2) / 2;
    if (anchor === "middle") {
      if (tx - approxHalf < x1) tx = x1 + approxHalf;
      if (tx + approxHalf > x2) tx = x2 - approxHalf;
    }
  }
  return (
    <text x={tx} y={ty} textAnchor={anchor}
          fontFamily="'JetBrains Mono', monospace"
          fontSize={11} fontWeight={700} fill={color}
          stroke={T.bg} strokeWidth={3} paintOrder="stroke"
          pointerEvents="none">
      {text}
    </text>
  );
};

// Multi-row hover tooltip box. `rows`: [{ color?, label, value, strong? }].
// Clamps inside [x1,x2] × [yTop,yBot]; flips to the left of the cursor
// when it would overflow the right edge.
const HoverTooltip = ({ x, y, x1, x2, yTop, yBot, title, rows, width = 150 }) => {
  const lineH = 15, padX = 9, padY = 8, titleH = title ? 16 : 0;
  const boxH = padY * 2 + titleH + rows.length * lineH;
  let bx = x + 12;
  if (x2 != null && bx + width > x2) bx = x - 12 - width;
  if (x1 != null && bx < x1) bx = x1 + 2;
  let by = y - boxH / 2;
  if (yTop != null && by < yTop) by = yTop;
  if (yBot != null && by + boxH > yBot) by = yBot - boxH;
  return (
    <g pointerEvents="none">
      <rect x={bx} y={by} width={width} height={boxH} rx={3}
            fill={T.bg} stroke={T.line} strokeWidth={1} opacity={0.97} />
      {title && (
        <text x={bx + padX} y={by + padY + 9}
              fontFamily="'JetBrains Mono', monospace" fontSize={9}
              fontWeight={700} fill={T.mute} letterSpacing="0.05em">{title}</text>
      )}
      {rows.map((r, i) => {
        const ry = by + padY + titleH + i * lineH + 9;
        const lx = bx + padX + (r.color ? 13 : 0);
        return (
          <g key={i}>
            {r.color && <rect x={bx + padX} y={ry - 8} width={8} height={8} rx={1} fill={r.color} />}
            <text x={lx} y={ry} fontFamily="'Inter', sans-serif" fontSize={10.5}
                  fill={r.strong ? T.ink : T.body} fontWeight={r.strong ? 700 : 400}>{r.label}</text>
            <text x={bx + width - padX} y={ry} textAnchor="end"
                  fontFamily="'JetBrains Mono', monospace" fontSize={10.5}
                  fontWeight={700} fill={r.strong ? T.ink : (r.color || T.ink)}>{r.value}</text>
          </g>
        );
      })}
    </g>
  );
};

const MultiYearFan = ({ realisedHistory, central, bull, bear, labels, xMin = 2024, xMax = 2041, monthTicks, width = 460, height = 220 }) => {
  // Terminal-label text for the three modelled lines. Defaults to the
  // named bull/mid/bear scenario framing; the long-view passes a
  // percentile framing ({central, upper, lower}) when it renders the
  // cube's P10-P90 cone.
  const lbl = labels || { central: "Central scenario", upper: "Bull", lower: "Bear" };
  // Short central label for the cramped terminal slot ("Central scenario
  // €165k" overruns the right edge → "Central €165k"). Central is drawn in
  // T.mute to match the left §01 chart, where the central reference is
  // muted grey and only the realised line is bold ink.
  const centralShort = (lbl.central || "Central").replace(/\s*scenario\s*$/i, "");
  const padL = 30, padR = 84, padT = 10, padB = 28;  // padR holds the
  // right-edge terminal labels ("Central €165k" is the longest).
  const innerW = width - padL - padR;
  const [hoverIdx, setHoverIdx] = React.useState(null);
  const innerH = height - padT - padB;
  // Filter each series to the visible window so out-of-range points
  // don't pull the y-scale (e.g. early 2024 realised values when the
  // chart is zoomed to a trailing 12-month window).
  const inRange = pts => pts.filter(p => p.y >= xMin && p.y <= xMax);
  const realisedVis = inRange(realisedHistory);
  const centralVis  = inRange(central);
  const bullVis     = inRange(bull);
  const bearVis     = inRange(bear);
  const allV = [
    ...realisedVis.map(d => d.v),
    ...centralVis.map(d => d.v),
    ...bullVis.map(d => d.v),
    ...bearVis.map(d => d.v),
  ];
  const yMax = niceMax((allV.length ? Math.max(...allV) : 1) * 1.08);
  const yMin = 0;
  const xScale = y => padL + (y - xMin) / (xMax - xMin) * innerW;
  const yScale = v => padT + (1 - (v - yMin) / (yMax - yMin)) * innerH;
  const interp = (pts) => {
    const sorted = [...pts].sort((a, b) => a.y - b.y);
    return sorted.map(p => ({ x: xScale(p.y), y: yScale(p.v) }));
  };
  const pathOf = pts => pts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");

  // Two independent series:
  //   * Realised line — trailing-12mo rolling, actual data, monthly.
  //   * Modelled cone — cube's frozen forecast from anchor_year+1 forward.
  // No bridging — let them overlap visually. The gap between realised
  // (where reality landed) and modelled (what we said it would be) is
  // the story the toggle wants the reader to see.
  const realisedPts = interp(realisedVis);
  const centralPts  = interp(centralVis);
  const bullPts     = interp(bullVis);
  const bearPts     = interp(bearVis);
  const envelopePath = bullPts.length && bearPts.length
    ? bullPts.map((p, i) => `${i ? "L" : "M"}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ") +
      " " + [...bearPts].reverse().map(p => `L${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ") + " Z"
    : "";

  // X-axis ticks: caller can pass month-resolution ticks (for short windows)
  // as ``[{y: decimal_year, label: "May'25"}, ...]``; otherwise use yearly.
  const fallbackYearTicks = (() => {
    const span = xMax - xMin;
    if (span >= 12) {
      // 5-year grid aligned to round years, starting at the first one ≥ xMin
      // (so no tick hangs left of a non-integer axis start).
      const out = [];
      for (let y = Math.ceil(xMin / 5) * 5; y <= xMax; y += 5) out.push(y);
      return out;
    }
    const step = span >= 6 ? 2 : span >= 2 ? 1 : 0.25;
    const out = [];
    for (let y = Math.ceil(xMin); y < xMax; y += step) out.push(y);
    return out;
  })();
  const ticks = monthTicks && monthTicks.length
    ? monthTicks
    : fallbackYearTicks.map(yr => ({ y: yr, label: String(yr) }));

  return (
    <svg width="100%" height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: "block" }}>
      {/* gridlines */}
      {[0, yMax / 2, yMax].map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={width - padR} y1={yScale(t)} y2={yScale(t)} stroke={T.lineSoft} strokeWidth={0.6} strokeDasharray={i === 0 ? "none" : "2 4"} />
          <text x={padL - 6} y={yScale(t) + 3} textAnchor="end" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{Math.round(t / 1000)}k</text>
        </g>
      ))}
      {ticks.map((t, idx) => (
        <text key={idx} x={xScale(t.y)} y={height - padB + 14} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{t.label}</text>
      ))}
      {/* envelope */}
      <path d={envelopePath} fill={T.ink} opacity={0.04} />
      {/* Modelled scenario lines (forward, from anchor year +1).
          Bull/Bear dashed colored, Central dashed dark — visually clear
          this is the FORECAST, not realised data. */}
      <path d={pathOf(bullPts)}    fill="none" stroke={T.high}  strokeWidth={1.2} strokeDasharray="4 3" opacity={0.75} />
      <path d={pathOf(bearPts)}    fill="none" stroke={T.amber} strokeWidth={1.2} strokeDasharray="4 3" opacity={0.75} />
      <path d={pathOf(centralPts)} fill="none" stroke={T.mute}  strokeWidth={1.4} strokeDasharray="5 3" opacity={0.9} />
      {/* Realised — thick solid black, trailing-12mo rolling. Drawn LAST
          so it overlays the cone when reality has been above/below the
          modelled central. */}
      <path d={pathOf(realisedPts)} fill="none" stroke={T.ink} strokeWidth={2.5} />
      {/* terminal labels — read from filtered visible arrays so they sit at
          the right edge of the rendered window. */}
      {[{ k: centralShort, v: centralVis[centralVis.length - 1], c: T.mute },
        { k: lbl.upper,    v: bullVis[bullVis.length - 1],       c: T.high },
        { k: lbl.lower,    v: bearVis[bearVis.length - 1],       c: T.amber }].filter(it => it.v).map((it, i) => (
        <text key={i} x={xScale(it.v.y) + 4} y={yScale(it.v.v) + 3}
              fontFamily="'JetBrains Mono', monospace" fontSize={9} fontWeight={700} fill={it.c}>
          {it.k} €{Math.round(it.v.v / 1000)}k
        </text>
      ))}
      {/* Realised endpoint label */}
      {realisedVis.length > 0 && (() => {
        const last = realisedVis[realisedVis.length - 1];
        return (
          <text x={xScale(last.y) + 4} y={yScale(last.v) - 6}
                fontFamily="'JetBrains Mono', monospace" fontSize={9} fontWeight={700} fill={T.ink}>
            Realised €{Math.round(last.v / 1000)}k
          </text>
        );
      })()}
      {/* Hover — snap to the nearest point across BOTH the realised line
          (monthly) and the cone years, so individual realised points are
          hoverable, not just the cone. Tooltip shows the cone band
          (interpolated at the hovered x) plus Realised when the trailing
          line reaches that far. */}
      <rect
        x={padL} y={padT} width={innerW} height={innerH}
        fill="transparent" pointerEvents="all"
        onMouseMove={(e) => {
          const svg = e.currentTarget.ownerSVGElement;
          const pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          const local = pt.matrixTransform(svg.getScreenCTM().inverse());
          const cands = [
            ...realisedVis.map(p => ({ y: p.y, isReal: true })),
            ...centralVis.map(p => ({ y: p.y, isReal: false })),
          ];
          let best = null, bestD = Infinity;
          cands.forEach(c => {
            const d = Math.abs(xScale(c.y) - local.x);
            if (d < bestD) { bestD = d; best = c; }
          });
          setHoverIdx(best);
        }}
        onMouseLeave={() => setHoverIdx(null)}
      />
      {hoverIdx && (() => {
        const yr = hoverIdx.y;
        // Linear-interpolate a cone series at the hovered x (cone is
        // yearly; realised is monthly → realised points land between knots).
        const interp = (pts) => {
          const a = pts || [];
          if (!a.length) return null;
          if (yr <= a[0].y) return a[0].v;
          if (yr >= a[a.length - 1].y) return a[a.length - 1].v;
          for (let i = 1; i < a.length; i++) {
            if (a[i].y >= yr) {
              const p0 = a[i - 1], p1 = a[i];
              const t = (yr - p0.y) / ((p1.y - p0.y) || 1);
              return p0.v + (p1.v - p0.v) * t;
            }
          }
          return a[a.length - 1].v;
        };
        const cv = interp(centralVis), bv = interp(bullVis), brv = interp(bearVis);
        // Realised value only on a realised snap (it sits exactly on the
        // monthly grid point we snapped to).
        let rv = null;
        if (hoverIdx.isReal) {
          const rp = realisedVis.reduce(
            (b, p) => (b == null || Math.abs(p.y - yr) < Math.abs(b.y - yr)) ? p : b, null);
          if (rp && Math.abs(rp.y - yr) < 0.04) rv = rp.v;
        }
        const hx = xScale(yr);
        const fmt = (v) => `€${Math.round(v / 1000)}k`;
        const MONTHS3 = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const yi = Math.floor(yr);
        const mi = Math.min(11, Math.max(0, Math.round((yr - yi) * 12 - 0.5)));
        const title = hoverIdx.isReal ? `${MONTHS3[mi]} '${String(yi).slice(2)}` : String(yi);
        const rows = [];
        if (bv != null)  rows.push({ color: T.high,  label: lbl.upper,    value: fmt(bv) });
        if (cv != null)  rows.push({ color: T.mute,  label: centralShort, value: fmt(cv) });
        if (brv != null) rows.push({ color: T.amber, label: lbl.lower,    value: fmt(brv) });
        if (rv != null)  rows.push({ label: "Realised", value: fmt(rv), strong: true });
        return (
          <g pointerEvents="none">
            <HoverLine x={hx} y0={padT} y1={padT + innerH} opacity={0.4} />
            {bv != null  && <HoverDot x={hx} y={yScale(bv)}  color={T.high} />}
            {cv != null  && <HoverDot x={hx} y={yScale(cv)}  color={T.mute} />}
            {brv != null && <HoverDot x={hx} y={yScale(brv)} color={T.amber} />}
            {rv != null  && <HoverDot x={hx} y={yScale(rv)}  color={T.ink} />}
            <HoverTooltip
              x={hx} y={yScale(rv != null ? rv : cv)} x1={padL} x2={width - padR}
              yTop={padT} yBot={padT + innerH}
              title={title} rows={rows} width={150}
            />
          </g>
        );
      })()}
    </svg>
  );
};

// ── Daily TB2 Spread Bars (§03) ─────────────────────────────────
// `tones` (optional) is a per-bar "good"|"warn"|"bad" array driven by
// the trailing-12 daily-TB2 quartiles. `p25`/`p75` (optional) draw the
// trailing reference lines. `hoverDay` + `onHover` wire the bar chart
// into a shared hover state so the HourlyShape spaghetti can highlight
// the matching day's profile.
const DailySpreadBars = ({ data, tones, topRanks, weather, isWeekend, p25, p75, hoverDay, onHover, yMaxOverride, w = 720, h = 200 }) => {
  const padL = 36, padR = 12, padT = 22, padB = 36;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const barGap = 1;
  const barW = (innerW - (data.length - 1) * barGap) / data.length;
  const dataMax = Math.max(...data);
  const refTop = Math.max(dataMax, p75 || 0);
  // yMaxOverride lets Sec03 lock the same scale across the live and
  // YoY-toggle views so the reader is comparing visuals at the same
  // resolution, not auto-rescaled per month.
  const yMax = yMaxOverride != null ? yMaxOverride : niceMax(refTop * 1.05);
  const yScale = v => padT + (1 - v / yMax) * innerH;
  const colorForLegacy = v => v >= 30 ? T.high : v >= 15 ? T.amber : T.low;
  const toneColor = t => t === "good" ? T.high : t === "warn" ? T.amber : t === "bad" ? T.low : T.mute;
  const ticks = (() => {
    if (p25 && p75) return [Math.round(p25), Math.round(p75)];
    return [15, 30, 45, 60];
  })();
  const handleEnter = (i) => onHover && onHover(i);
  const handleLeave = () => onHover && onHover(null);
  // Single sliding selection outline. As hoverDay moves (incl. via the
  // Top-3 list), the outline tweens its x + top edge from one bar to the
  // next instead of the highlight jumping bar-to-bar. day→day glides;
  // entering/leaving snaps. NB: tween x and y as separate NUMBERS, not as
  // one {x,y} object — useTween restarts on a new target *reference*, and
  // a fresh object literal every render would restart the tween each frame
  // (the value never settles → visible jitter). Numbers compare by value.
  const baseY = h - padB;
  const hlShow = hoverDay != null && data[hoverDay] != null;
  const hlX = hlShow ? padL + hoverDay * (barW + barGap) : null;
  const hlY = hlShow ? yScale(data[hoverDay]) : null;
  const hlXLast = React.useRef(hlX);
  const hlYLast = React.useRef(hlY);
  if (hlX != null) hlXLast.current = hlX;
  if (hlY != null) hlYLast.current = hlY;
  const tx = useTween(hlX != null ? hlX : hlXLast.current);
  const ty = useTween(hlY != null ? hlY : hlYLast.current);
  return (
    <svg
      width="100%" height={h} viewBox={`0 0 ${w} ${h}`}
      style={{ display: "block" }}
      onMouseLeave={handleLeave}
    >
      {/* Weekend background bands — Sat+Sun get a faint tint so the
          reader can spot weekly rhythm at a glance. Drawn FIRST so
          bars + ticks sit on top. */}
      {isWeekend && data.map((v, i) => {
        if (!isWeekend[i]) return null;
        const x = padL + i * (barW + barGap);
        return (
          <rect
            key={`we${i}`}
            x={x - barGap / 2} y={padT}
            width={barW + barGap}
            height={h - padB - padT + 18}
            fill={T.tint}
            opacity={0.85}
          />
        );
      })}
      {/* Trailing-12 reference lines. With p25/p75 supplied these are the
          weak-day (p25) and best-day (p75) cut-lines that colour the bars;
          labelled with the € unit + a line tag so the two bare numbers
          read as thresholds, not an axis. */}
      {ticks.map((t, ti) => t > yMax ? null : (
        <g key={t}>
          <line x1={padL} x2={w - padR} y1={yScale(t)} y2={yScale(t)} stroke={T.line} strokeWidth={0.6} strokeDasharray="4 4" />
          <text x={padL - 6} y={yScale(t) + 3} textAnchor="end" fontFamily="'JetBrains Mono', monospace" fontSize={9}
                fill={p25 != null && p75 != null ? (ti === 1 ? T.high : T.low) : T.mute}>
            {p25 != null && p75 != null ? `€${t}` : t}
          </text>
          {/* Tiny tag by each € value (in the left margin, clear of the
              bars) so the two reference lines read as the best-day / weak-day
              cut-lines that colour the bars, not a bare axis. Best-day tag
              sits above its line, weak-day below, so the two don't crowd. */}
          {p25 != null && p75 != null && (
            <text x={padL - 6} y={yScale(t) + (ti === 1 ? -8 : 13)} textAnchor="end"
                  fontFamily="'JetBrains Mono', monospace" fontSize={7}
                  fill={ti === 1 ? T.high : T.low} letterSpacing="0.04em">
              {ti === 1 ? "best" : "weak"}
            </text>
          )}
        </g>
      ))}
      {/* baseline */}
      <line x1={padL} x2={w - padR} y1={h - padB} y2={h - padB} stroke={T.line} strokeWidth={0.6} />
      {/* bars */}
      {data.map((v, i) => {
        const x = padL + i * (barW + barGap);
        const fill = tones && tones[i] ? toneColor(tones[i]) : colorForLegacy(v);
        const isHover = hoverDay === i;
        return (
          <g key={i} onMouseEnter={() => handleEnter(i)}>
            {/* invisible hit-area for narrow bars */}
            <rect x={x - 0.5} y={padT} width={barW + 1} height={innerH} fill="transparent" />
            <rect
              x={x} y={yScale(v)} width={barW} height={h - padB - yScale(v)}
              fill={fill}
              opacity={hoverDay == null || isHover ? 0.95 : 0.5}
            />
            {/* No per-bar hover tooltip — it overlaps the rank badge on
                tall bars, and the hover info is already conveyed by the
                bar's outline, the linked HourlyShape highlight, and the
                "day N" label in the top corner of the hourly chart. */}
          </g>
        );
      })}
      {hlShow && tx != null && ty != null && (
        <rect x={tx} y={ty} width={barW}
              height={Math.max(0, baseY - ty)}
              fill="none" stroke={T.ink} strokeWidth={0.9} rx={1}
              pointerEvents="none" />
      )}
      {/* x labels at every 5 days */}
      {data.map((v, i) => (i + 1) % 5 === 0 ? (
        <text key={`l${i}`} x={padL + i * (barW + barGap) + barW / 2} y={h - padB + 14} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{i + 1}</text>
      ) : null)}
      {/* Weather icons under each bar — sun = ☀ glyph, wind = inline
          SVG of two flowing curves with hooked ends (emoji 💨 read
          as "fog", not wind). Cloud days stay blank to keep the row
          visually quiet. Each glyph carries a hover <title> explaining it. */}
      {weather && data.map((v, i) => {
        const tag = weather[i];
        if (tag !== "sun" && tag !== "wind") return null;
        const cx = padL + i * (barW + barGap) + barW / 2;
        if (tag === "sun") {
          return (
            <text key={`wx${i}`} x={cx} y={h - padB + 26}
                  textAnchor="middle" fontSize={11} opacity={0.85}>☀</text>
          );
        }
        return (
          <g key={`wx${i}`} transform={`translate(${cx - 6}, ${h - padB + 18})`}
             stroke={T.body} strokeWidth={1} fill="none"
             strokeLinecap="round" opacity={0.8}>
            <path d="M0 3 Q3 0.5 6 3 T11 3 q2 0 2 -2" />
            <path d="M0 8 Q4 5.5 7 8 T13 8" />
          </g>
        );
      })}
      {/* Top-1/2/3 badges above the corresponding bars */}
      {topRanks && data.map((v, i) => {
        const rank = topRanks[i];
        if (rank == null) return null;
        const cx = padL + i * (barW + barGap) + barW / 2;
        const cy = Math.max(padT - 6, yScale(v) - 10);
        return (
          <g key={`r${i}`} pointerEvents="none">
            <circle cx={cx} cy={cy} r={7} fill={T.ink} />
            <text
              x={cx} y={cy + 3}
              textAnchor="middle"
              fontFamily="'JetBrains Mono', monospace"
              fontSize={9} fontWeight={700} fill={T.bg}
            >{rank}</text>
          </g>
        );
      })}
      {/* No per-bar value readout here — the linked HourlyShape below
          lights up the hovered day's full price profile, which carries
          both the daily peak and the spread story. The bar outline +
          dimmed neighbours is enough "this column is selected" cue. */}
    </svg>
  );
};

// ── Hourly Shape (§03) ──────────────────────────────────────────
// `daily` (optional) is a list of 24-element price arrays — one per
// day. When provided, each day renders as a faint thin line under the
// monthly + trailing-12 averages, showing the dispersion behind the
// average. Y-axis is clamped to a P95 of all values so a single
// negative-spike day doesn't squash the rest of the chart.
//
// `hoverDay`/`onHover` wire the chart into Sec03's shared hover state
// so pointing at a day on either the daily-bar chart or here lights up
// that day's line on this chart in full opacity.
const HourlyShape = ({ month, trailing, daily, dayTones, hoverDay, onHover, yMaxOverride, w = 380, h = 200 }) => {
  const toneColor = t => t === "good" ? T.high : t === "warn" ? T.amber : t === "bad" ? T.low : T.accent;
  const padL = 36, padR = 12, padT = 12, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const days = (daily && daily.length) ? daily : [];
  // Highlighted-day curve morphs from one day's shape into the next as the
  // reader drags along the daily-spread bars. Entering/leaving the hover
  // snaps; day→day moves tween (both are aligned 24-hour grids).
  const hoverCurve = (hoverDay != null && days[hoverDay]) ? days[hoverDay] : null;
  const lastCurveRef = React.useRef(hoverCurve);
  if (hoverCurve) lastCurveRef.current = hoverCurve;
  const tweenCurve = useTween(hoverCurve || lastCurveRef.current);
  const showHover = hoverDay != null && !!days[hoverDay];
  const flat = days.flat();
  // Robust y-bounds: top is P95 of all observed prices so a single €600
  // spike doesn't flatten the chart. Bottom is fixed near zero — when a
  // day plunges to −€200 or worse the line is allowed to fall off the
  // chart (clipped by the surrounding figure) rather than squashing the
  // visible range. That preserves the rest of the month's resolution
  // while still hinting "something deep happened".
  const allValues = [...month, ...trailing, ...flat];
  const sorted = [...allValues].sort((a, b) => a - b);
  const pct = (p) => sorted.length ? sorted[Math.floor(p * (sorted.length - 1))] : 0;
  const yMin = -30; // shallow neg floor — anything deeper just plunges
  const yMaxRaw = Math.max(pct(0.95), Math.max(...month) * 1.05, Math.max(...trailing) * 1.05);
  const yMax = yMaxOverride != null ? yMaxOverride : niceMax(yMaxRaw);
  const span = (yMax - yMin) || 1;
  const yScale = v => padT + (1 - (v - yMin) / span) * innerH;
  const xScale = i => padL + (i / 23) * innerW;
  // No clamp on either side — values above yMax or below yMin draw
  // outside the viewBox and clip naturally. Clamping the path created
  // a fake flat-top on days where peak > yMax (line plateaued at the
  // chart edge while the marker correctly sat at the real value
  // position, disconnecting the two).
  const pathOf = data => data.map((v, i) => `${i ? "L" : "M"}${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(" ");
  const ticks = [yMin, (yMin + yMax) / 2, yMax].map(t => Math.round(t));
  return (
    <svg
      width="100%" height={h} viewBox={`0 0 ${w} ${h}`}
      style={{ display: "block", overflow: "hidden" }}
      onMouseLeave={() => onHover && onHover(null)}
    >
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={w - padR} y1={yScale(t)} y2={yScale(t)} stroke={T.lineSoft} strokeWidth={0.6} strokeDasharray={t === 0 ? "none" : "2 4"} />
          <text x={padL - 6} y={yScale(t) + 3} textAnchor="end" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{t}</text>
        </g>
      ))}
      {(() => {
        // Hide hour labels that the peak/trough marker (or its €-label)
        // sits on top of — otherwise "12h" peeks through the €-value
        // annotation and reads as visual noise. Applies to both the
        // hover-day markers and the always-visible month-avg ones.
        let hideXs = [];
        if (hoverDay != null && days[hoverDay]) {
          const dh = days[hoverDay];
          let mx = 0, mn = 0;
          for (let i = 1; i < dh.length; i++) {
            if (dh[i] > dh[mx]) mx = i;
            if (dh[i] < dh[mn]) mn = i;
          }
          hideXs = [xScale(mx), xScale(mn)];
        } else if (month && month.length > 0) {
          let mx = 0, mn = 0;
          for (let i = 1; i < month.length; i++) {
            if (month[i] > month[mx]) mx = i;
            if (month[i] < month[mn]) mn = i;
          }
          hideXs = [xScale(mx), xScale(mn)];
        }
        return [0, 6, 12, 18, 23].map(hh => {
          const lx = xScale(hh);
          // Distance threshold sized to cover the widest €-label
          // (~"€-414" ≈ 32 px wide) plus the axis label's own half-width.
          const tooClose = hideXs.some(hx => Math.abs(hx - lx) < 36);
          return (
            <text key={hh} x={lx} y={h - padB + 14} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute} opacity={tooClose ? 0 : 1}>{String(hh).padStart(2, "0")}h</text>
          );
        });
      })()}
      {days.map((d, i) => {
        const isHover = hoverDay === i;
        // The hovered day is drawn by the morphing highlight path below;
        // hide its static copy here so the two don't double up mid-tween.
        return (
          <path
            key={`day-${i}`}
            d={pathOf(d)}
            fill="none"
            stroke={T.wh}
            strokeWidth={0.7}
            opacity={hoverDay == null ? 0.18 : (isHover ? 0 : 0.08)}
            onMouseEnter={() => onHover && onHover(i)}
          />
        );
      })}
      {/* Capture mouse exit on the whole svg area */}
      {onHover && (
        <rect
          x={padL} y={padT} width={innerW} height={innerH}
          fill="transparent" pointerEvents="none"
        />
      )}
      <path d={pathOf(trailing)} fill="none" stroke={T.mute} strokeWidth={1.4} strokeDasharray="3 3" opacity={0.85} pointerEvents="none" />
      <path d={pathOf(month)}    fill="none" stroke={T.wh}   strokeWidth={2.6} opacity={hoverDay == null ? 1 : 0.4} pointerEvents="none" />
      {showHover && Array.isArray(tweenCurve) && (
        <path d={pathOf(tweenCurve)} fill="none"
              stroke={toneColor(dayTones && dayTones[hoverDay])}
              strokeWidth={2} opacity={1} pointerEvents="none" />
      )}
      {/* Always-visible peak + trough markers on the month-average
          curve — the duck-curve story IS the spread between evening
          peak and midday trough. Suppressed while a day is hovered
          (those markers take over the focal reading). */}
      {hoverDay == null && month && month.length > 0 && (() => {
        let maxIdx = 0, minIdx = 0;
        for (let i = 1; i < month.length; i++) {
          if (month[i] > month[maxIdx]) maxIdx = i;
          if (month[i] < month[minIdx]) minIdx = i;
        }
        const xPeak = xScale(maxIdx);
        const xTrough = xScale(minIdx);
        const peakY = yScale(month[maxIdx]);
        const troughY = yScale(month[minIdx]);
        return (
          <g pointerEvents="none">
            <HoverDot x={xPeak}   y={peakY}   color={T.wh} />
            <HoverDot x={xTrough} y={troughY} color={T.wh} />
            <HoverValueLabel
              x={xPeak} y={peakY}
              text={`€${Math.round(month[maxIdx])}`}
              place="above"
              x1={padL} x2={w - padR}
              color={T.wh}
            />
            <HoverValueLabel
              x={xTrough} y={troughY}
              text={`€${Math.round(month[minIdx])}`}
              place="below"
              x1={padL} x2={w - padR}
              color={T.wh}
            />
          </g>
        );
      })()}
      {hoverDay != null && days[hoverDay] && (
        <text
          x={w - padR - 4} y={padT + 12}
          textAnchor="end"
          fontFamily="'JetBrains Mono', monospace" fontSize={10}
          fill={toneColor(dayTones && dayTones[hoverDay])}
        >day {hoverDay + 1}</text>
      )}
      {hoverDay != null && days[hoverDay] && (() => {
        // Peak + trough markers for the hovered day. The dot sits at the
        // TRUE value position so it always lands on the line; when the
        // value runs off-range it clips together with the line (overflow
        // hidden) instead of detaching to the viewBox edge. The label is
        // clamped into view with an ↑/↓ prefix when the value is off-range.
        const d = (Array.isArray(tweenCurve) && tweenCurve.length === days[hoverDay].length)
          ? tweenCurve : days[hoverDay];
        let maxIdx = 0, minIdx = 0;
        for (let i = 1; i < d.length; i++) {
          if (d[i] > d[maxIdx]) maxIdx = i;
          if (d[i] < d[minIdx]) minIdx = i;
        }
        const c = toneColor(dayTones && dayTones[hoverDay]);
        const peakValue = d[maxIdx], troughValue = d[minIdx];
        const xMax = xScale(maxIdx), xMin = xScale(minIdx);
        const peakY = yScale(peakValue), troughY = yScale(troughValue);
        const peakOver = peakValue > yMax, troughOver = troughValue < yMin;
        const peakLabelY = Math.max(padT + 9, peakY > 12 ? peakY - 8 : peakY + 14);
        const troughLabelY = Math.min(h - padB - 2, troughY < h - 12 ? troughY + 14 : troughY - 8);
        return (
          <g pointerEvents="none">
            <circle cx={xMax} cy={peakY} r={3.4} fill={c} stroke={T.bg} strokeWidth={1.2} />
            <text x={xMax} y={peakLabelY} textAnchor="middle"
                  fontFamily="'JetBrains Mono', monospace" fontSize={10} fontWeight={700} fill={c}
                  stroke={T.bg} strokeWidth={3} paintOrder="stroke">
              {peakOver ? "↑ " : ""}€{Math.round(peakValue)}
            </text>
            <circle cx={xMin} cy={troughY} r={3.4} fill={c} stroke={T.bg} strokeWidth={1.2} />
            <text x={xMin} y={troughLabelY} textAnchor="middle"
                  fontFamily="'JetBrains Mono', monospace" fontSize={10} fontWeight={700} fill={c}
                  stroke={T.bg} strokeWidth={3} paintOrder="stroke">
              {troughOver ? "↓ " : ""}€{Math.round(troughValue)}
            </text>
          </g>
        );
      })()}
    </svg>
  );
};

// ── aFRR Clearing trend (§04 chart 1) ───────────────────────────
const AfrrClearingTrend = ({ pos, neg, months = [], w = 360, h = 170 }) => {
  const padL = 32, padR = 10, padT = 14, padB = 28;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const yMax = niceMax(Math.max(...pos, ...neg) * 1.1);
  const yScale = v => padT + (1 - v / yMax) * innerH;
  const xScale = i => padL + (i / Math.max(pos.length - 1, 1)) * innerW;
  const pathOf = data => data.map((v, i) => `${i ? "L" : "M"}${xScale(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {[0, yMax / 2, yMax].map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={w - padR} y1={yScale(t)} y2={yScale(t)} stroke={T.lineSoft} strokeWidth={0.6} strokeDasharray={i === 0 ? "none" : "2 4"} />
          <text x={padL - 6} y={yScale(t) + 3} textAnchor="end" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{Math.round(t)}</text>
        </g>
      ))}
      <path d={pathOf(neg)} fill="none" stroke={T.amber} strokeWidth={1.6} />
      <path d={pathOf(pos)} fill="none" stroke={T.acap} strokeWidth={1.6} />
      {pos.map((v, i) => <circle key={`p${i}`} cx={xScale(i)} cy={yScale(v)} r={2.2} fill={T.acap} />)}
      {neg.map((v, i) => <circle key={`n${i}`} cx={xScale(i)} cy={yScale(v)} r={2.2} fill={T.amber} />)}
      {months.map((m, i) => (
        <text
          key={`m${i}`}
          x={xScale(i)}
          y={h - padB + 14}
          textAnchor="middle"
          fontFamily="'JetBrains Mono', monospace"
          fontSize={9}
          fill={i === months.length - 1 ? T.ink : T.mute}
          fontWeight={i === months.length - 1 ? 700 : 500}
        >{m}</text>
      ))}
    </svg>
  );
};


// ── aFRR Supply trend mini (§04 right column) ───────────────────
// Trailing-12 offered MW per month — the structural cliff signal.
// More BESS bidders → deeper bid stack → clearing compression. Last
// month is the highlighted dot.
const AfrrSupplyTrend = ({ data = [], w = 240, h = 78 }) => {
  if (!data.length) return null;
  const padL = 28, padR = 8, padT = 8, padB = 18;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const vals = data.map(d => d.v || 0);
  const yMin = Math.min(...vals) * 0.95;
  const yMax = Math.max(...vals) * 1.05;
  const xStep = innerW / Math.max(data.length - 1, 1);
  const xAt = i => padL + i * xStep;
  const yAt = v => padT + (1 - (v - yMin) / (yMax - yMin)) * innerH;
  const path = data
    .map((d, i) => `${i ? "L" : "M"}${xAt(i).toFixed(1)} ${yAt(d.v).toFixed(1)}`)
    .join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {/* y-axis range labels */}
      <text x={padL - 6} y={padT + 4} textAnchor="end"
            fontFamily="'JetBrains Mono', monospace" fontSize={8.5} fill={T.mute}>
        {Math.round(yMax).toLocaleString()}
      </text>
      <text x={padL - 6} y={h - padB + 4} textAnchor="end"
            fontFamily="'JetBrains Mono', monospace" fontSize={8.5} fill={T.mute}>
        {Math.round(yMin).toLocaleString()}
      </text>
      <path d={path} fill="none" stroke={T.acap} strokeWidth={1.6} />
      {data.map((d, i) => (
        <circle key={i} cx={xAt(i)} cy={yAt(d.v)}
                r={d.current ? 3 : 1.6}
                fill={d.current ? T.ink : T.acap}
                opacity={d.current ? 1 : 0.65} />
      ))}
      {/* first + last + current x-labels */}
      {data.map((d, i) => {
        const isEdge = i === 0 || i === data.length - 1;
        if (!isEdge) return null;
        return (
          <text key={`xl${i}`} x={xAt(i)} y={h - padB + 14}
                textAnchor={i === 0 ? "start" : "end"}
                fontFamily="'JetBrains Mono', monospace" fontSize={9}
                fill={T.mute}>
            {d.m}
          </text>
        );
      })}
    </svg>
  );
};

// ── aFRR Daily directional bars (§04) ───────────────────────────
// Diverging bar chart + month-rhythm signals. SAME color vocabulary
// as §03 daily TB2 bars: green = best day, amber = normal, red = weak.
// • POS daily revenue extends UP from the midline, NEG extends DOWN —
//   position carries direction; the colour channel is reserved for
//   QUALITY so the reader uses one mental model across §03 and §04.
//   POS and NEG of the same day get coloured INDEPENDENTLY from each
//   direction's own P25/P75 distribution (a day can be exceptional in
//   NEG but only normal in POS — that asymmetry is the signal).
// • Weekend + holiday days get a faint background band.
// • Top-3 ranks are PER DIRECTION — three badges above POS bars,
//   three below NEG bars; alignment (or lack of it) reads at a glance.
// • Regime glyph (☀ ▲ ▼ ⇅) sits BELOW the day numbers — same row as
//   §03's weather glyphs, so both kinds of "what kind of day" metadata
//   live in the same place across sections.
// Hover emits the date so calendar + fingerprint stay in sync.
const AFRR_QUALITY_FILL = {
  EXCEPTIONAL: T.high,
  GOOD:        T.high,
  MID:         T.amber,
  SOFT:        T.low,
  "EXTREME-LOW": T.low,
};
const AFRR_QUALITY_OPACITY = {
  EXCEPTIONAL: 1.0,
  GOOD:        0.78,
  MID:         0.85,
  SOFT:        0.78,
  "EXTREME-LOW": 1.0,
};
const AfrrDailyDirectionalBars = ({
  days = [], holidays = [], hoverDay = null, onHover = () => {},
  w = 620, h = 240,
}) => {
  const holidaySet = new Set(holidays || []);
  if (!days.length) {
    return (
      <div style={{
        height: h, display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
        color: T.mute, fontSize: 12,
      }}>No daily aFRR data this month.</div>
    );
  }
  const padL = 40, padR = 12, padT = 22, padB = 44;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const allPos = days.map(d => d.pos_daily_eur || 0);
  const allNeg = days.map(d => d.neg_daily_eur || 0);
  // Per-direction P25 / P75 — independent yardsticks per direction.
  const sortAsc = arr => [...arr].filter(v => v > 0).sort((a, b) => a - b);
  const quantile = (sorted, q) => {
    if (!sorted.length) return 0;
    const idx = Math.max(0, Math.min(sorted.length - 1, Math.round(q * (sorted.length - 1))));
    return sorted[idx];
  };
  const posSorted = sortAsc(allPos);
  const negSorted = sortAsc(allNeg);
  const posP25 = quantile(posSorted, 0.25);
  const posP75 = quantile(posSorted, 0.75);
  const negP25 = quantile(negSorted, 0.25);
  const negP75 = quantile(negSorted, 0.75);
  const qualityFor = (v, p25, p75) => {
    if (v == null || v <= 0) return null;
    if (v >= p75) return "GOOD";
    if (v >= p25) return "MID";
    return "SOFT";
  };
  const peak = Math.max(1, ...allPos, ...allNeg);
  const padded = peak * 1.1;
  const mag = Math.pow(10, Math.floor(Math.log10(padded)));
  const norm = padded / mag;
  let step = 1;
  if (norm > 5) step = 10;
  else if (norm > 2) step = 5;
  else if (norm > 1) step = 2;
  const yMax = step * mag;
  const yMidline = padT + innerH / 2;
  const halfH = innerH / 2;
  const yScalePos = v => yMidline - (v / yMax) * halfH;
  const yScaleNeg = v => yMidline + (v / yMax) * halfH;
  const xStep = innerW / days.length;
  const barW = Math.min(xStep * 0.72, 22);
  // Single sliding selection column. As the hovered day moves the outline
  // tweens its x from one column to the next rather than the box jumping
  // bar-to-bar. day→day glides; entering/leaving snaps.
  const hlIdx = days.findIndex(d => d.date === hoverDay);
  const hlX = hlIdx >= 0 ? padL + hlIdx * xStep + (xStep - barW) / 2 : null;
  const hlLastRef = React.useRef(hlX);
  if (hlX != null) hlLastRef.current = hlX;
  const hlTween = useTween(hlX != null ? hlX : hlLastRef.current);

  // Combined Top-3 ranked by absolute day total (POS + NEG). The badge
  // is placed on the side of the larger bar so it visually reads as
  // "this day was big because of <direction>".
  const combinedRanks = (() => {
    const totals = days.map((d, i) => ({
      i,
      v: (d.pos_daily_eur || 0) + (d.neg_daily_eur || 0),
      side: (d.neg_daily_eur || 0) >= (d.pos_daily_eur || 0) ? "NEG" : "POS",
    }));
    totals.sort((a, b) => b.v - a.v);
    const out = new Array(days.length).fill(null);
    for (let r = 0; r < Math.min(3, totals.length); r++) {
      if (totals[r].v > 0) out[totals[r].i] = { rank: r + 1, side: totals[r].side };
    }
    return out;
  })();

  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {/* Weekend + holiday bands — same idiom as §03 daily TB2 bars. */}
      {days.map((d, i) => {
        const dow = new Date(d.date + "T00:00:00").getDay();
        const isHoliday = holidaySet.has(d.date);
        const isWeekend = dow === 0 || dow === 6;
        if (!isHoliday && !isWeekend) return null;
        const x = padL + i * xStep;
        return (
          <rect key={`we${i}`}
                x={x} y={padT}
                width={xStep} height={innerH}
                fill={T.tint}
                opacity={isHoliday ? 1 : 0.7} />
        );
      })}
      {/* Y-axis ticks */}
      {[yMax, yMax / 2, 0, -yMax / 2, -yMax].map((t, i) => {
        const y = t >= 0 ? yScalePos(t) : yScaleNeg(-t);
        const isMid = t === 0;
        return (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={y} y2={y}
                  stroke={isMid ? T.line : T.lineSoft}
                  strokeWidth={isMid ? 1 : 0.5}
                  strokeDasharray={isMid ? "none" : "2 4"} />
            <text x={padL - 6} y={y + 3} textAnchor="end"
                  fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>
              {Math.abs(Math.round(t))}
            </text>
          </g>
        );
      })}
      {/* Direction labels — neutral. Colour is reserved for quality. */}
      <text x={padL + 4} y={padT + 10}
            fontFamily="'JetBrains Mono', monospace" fontSize={9}
            fontWeight={700} fill={T.body}>POS ↑</text>
      <text x={padL + 4} y={h - padB - 2}
            fontFamily="'JetBrains Mono', monospace" fontSize={9}
            fontWeight={700} fill={T.body}>NEG ↓</text>
      {/* Bars — POS and NEG of one day get coloured INDEPENDENTLY by
          how each magnitude ranks within its own direction's
          distribution. */}
      {days.map((d, i) => {
        const x = padL + i * xStep + (xStep - barW) / 2;
        const posH = d.pos_daily_eur ? (d.pos_daily_eur / yMax) * halfH : 0;
        const negH = d.neg_daily_eur ? (d.neg_daily_eur / yMax) * halfH : 0;
        const isHovered = hoverDay === d.date;
        const posQ = qualityFor(d.pos_daily_eur, posP25, posP75);
        const negQ = qualityFor(d.neg_daily_eur, negP25, negP75);
        const posFill = AFRR_QUALITY_FILL[posQ] || T.amber;
        const negFill = AFRR_QUALITY_FILL[negQ] || T.amber;
        const posOpacity = isHovered ? 1 : (AFRR_QUALITY_OPACITY[posQ] ?? 0.85);
        const negOpacity = isHovered ? 1 : (AFRR_QUALITY_OPACITY[negQ] ?? 0.85);
        return (
          <g key={d.date}
             onMouseEnter={() => onHover(d.date)}
             onMouseLeave={() => onHover(null)}
             style={{ cursor: "pointer" }}>
            {posH > 0 && (
              <rect x={x} y={yMidline - posH} width={barW} height={posH}
                    fill={posFill} opacity={posOpacity} />
            )}
            {negH > 0 && (
              <rect x={x} y={yMidline} width={barW} height={negH}
                    fill={negFill} opacity={negOpacity} />
            )}
            {/* invisible hover hit-zone covering the full column */}
            <rect x={padL + i * xStep} y={padT}
                  width={xStep} height={innerH}
                  fill="transparent" />
          </g>
        );
      })}
      {hlIdx >= 0 && hlTween != null && (
        <rect x={hlTween - 1} y={padT} width={barW + 2} height={innerH}
              fill="none" stroke={T.ink} strokeWidth={1.2}
              pointerEvents="none" />
      )}
      {/* Regime glyph BELOW the day numbers — same row as §03 weather. */}
      {days.map((d, i) => {
        const g = REGIME_GLYPH[d.regime_label] || "";
        if (!g) return null;
        const cx = padL + i * xStep + xStep / 2;
        return (
          <text
            key={`g${i}`}
            x={cx} y={h - padB + 26}
            textAnchor="middle"
            fontFamily="'Source Serif 4', serif"
            fontSize={11.5}
            fill={T.body}
            opacity={0.85}
            pointerEvents="none"
          >{g}</text>
        );
      })}
      {/* Single combined Top-3 rank badge — placed on the side of the
          larger bar so the visual immediately tells you which direction
          drove the day. */}
      {combinedRanks.map((slot, i) => {
        if (slot == null) return null;
        const d = days[i];
        const cx = padL + i * xStep + xStep / 2;
        let cy;
        if (slot.side === "POS") {
          const posH = d.pos_daily_eur ? (d.pos_daily_eur / yMax) * halfH : 0;
          cy = Math.max(padT + 4, yMidline - posH - 9);
        } else {
          const negH = d.neg_daily_eur ? (d.neg_daily_eur / yMax) * halfH : 0;
          cy = Math.min(padT + innerH - 4, yMidline + negH + 9);
        }
        return (
          <g key={`rk${i}`} pointerEvents="none">
            <circle cx={cx} cy={cy} r={7} fill={T.ink} />
            <text x={cx} y={cy + 3}
                  textAnchor="middle"
                  fontFamily="'JetBrains Mono', monospace"
                  fontSize={9} fontWeight={700}
                  fill={T.bg}>{slot.rank}</text>
          </g>
        );
      })}
      {/* X-axis day labels (every 5th + edges) */}
      {days.map((d, i) => {
        const day = new Date(d.date + "T00:00:00").getDate();
        const isEdge = i === 0 || i === days.length - 1;
        if (!isEdge && day % 5 !== 0) return null;
        const x = padL + i * xStep + xStep / 2;
        return (
          <text key={`x${i}`} x={x} y={h - padB + 12}
                textAnchor="middle"
                fontFamily="'JetBrains Mono', monospace" fontSize={9}
                fill={T.mute}>
            {day}
          </text>
        );
      })}
      {/* No per-bar €value readout on hover — the fingerprint chart
          below already lights up the hovered day's POS+NEG curves
          with peak markers, which carries the value story. Mirrors
          §02 wholesale (TB2 bars + duck curve below). */}
    </svg>
  );
};

// ── aFRR ToD fingerprint (§04) ──────────────────────────────────
// Three-line idiom (mirrors §03 hourly profile):
//   solid neutral teal = this-month avg (POS above midline, NEG below)
//   dashed grey        = 12-month trailing avg (P50)
//   solid coloured     = hovered day, in its per-direction QUALITY color
// The reader carries one mental model: dashed = baseline,
// solid = current, colour = quality.
const AfrrTodFingerprint = ({
  posMonth = [], negMonth = [],
  posTrailing = null, negTrailing = null,
  hoverDayPosBlocks = null, hoverDayNegBlocks = null,
  hoverDayLabel = null,
  hoverPosQuality = null,
  hoverNegQuality = null,
  blockLabels = ["00–04", "04–08", "08–12", "12–16", "16–20", "20–24"],
  periodLabels = ["Night", "Dawn", "Morning", "Midday", "Evening", "Late"],
  yMaxOverride = null,
  w = 620, h = 230,
}) => {
  const padL = 40, padR = 12, padT = 22, padB = 44;
  const innerW = w - padL - padR;
  const plotTop = padT, plotBottom = h - padB;
  const innerH = plotBottom - plotTop;
  // Hovered-day POS/NEG block curves morph from one day into the next as
  // the reader drags along the daily capacity-revenue bars. day→day moves
  // tween (aligned 6-block grids); entering/leaving the hover snaps.
  const posLastRef = React.useRef(hoverDayPosBlocks);
  const negLastRef = React.useRef(hoverDayNegBlocks);
  if (hoverDayPosBlocks) posLastRef.current = hoverDayPosBlocks;
  if (hoverDayNegBlocks) negLastRef.current = hoverDayNegBlocks;
  const posTween = useTween(hoverDayPosBlocks || posLastRef.current);
  const negTween = useTween(hoverDayNegBlocks || negLastRef.current);
  const posBlocks = hoverDayPosBlocks
    ? (Array.isArray(posTween) ? posTween : hoverDayPosBlocks) : null;
  const negBlocks = hoverDayNegBlocks
    ? (Array.isArray(negTween) ? negTween : hoverDayNegBlocks) : null;
  const monthVals = [...posMonth, ...negMonth]
    .filter(v => v != null && !isNaN(v))
    .map(Math.abs);
  const yMax = (yMaxOverride != null && yMaxOverride > 0)
    ? yMaxOverride
    : niceMax(Math.max(1, ...monthVals) * 1.2);
  const n = Math.max(posMonth.length, negMonth.length, blockLabels.length, 1);
  const xStep = innerW / n;
  const xCenter = i => padL + (i + 0.5) * xStep;
  const yMidline = plotTop + innerH / 2;
  const halfH = innerH / 2;
  // Unclamped scales: over-axis values draw past the plot edge and are
  // clipped (the line exits the bottom/top and re-enters), like §02.
  const yScalePos = v => yMidline - (v / yMax) * halfH;
  const yScaleNeg = v => yMidline + (v / yMax) * halfH;
  // Edge-clamped positions so peak markers/labels stay on-chart even when
  // the value runs off-axis (label then gets an ↑/↓ over-axis prefix).
  const yMarkPos = v => Math.max(plotTop + 2, yScalePos(v));
  const yMarkNeg = v => Math.min(plotBottom - 2, yScaleNeg(v));
  const clipId = "todClip";
  const pathPos = arr => {
    const parts = [];
    arr.forEach((v, i) => {
      if (v == null || isNaN(v)) return;
      parts.push(`${parts.length ? "L" : "M"}${xCenter(i).toFixed(1)} ${yScalePos(v).toFixed(1)}`);
    });
    return parts.join(" ");
  };
  const pathNeg = arr => {
    const parts = [];
    arr.forEach((v, i) => {
      if (v == null || isNaN(v)) return;
      parts.push(`${parts.length ? "L" : "M"}${xCenter(i).toFixed(1)} ${yScaleNeg(v).toFixed(1)}`);
    });
    return parts.join(" ");
  };
  // Area between the this-month POS and NEG average lines.
  const monthArea = (() => {
    const pos = [], neg = [];
    posMonth.forEach((v, i) => { if (v != null && !isNaN(v)) pos.push([xCenter(i), yScalePos(v)]); });
    negMonth.forEach((v, i) => { if (v != null && !isNaN(v)) neg.push([xCenter(i), yScaleNeg(v)]); });
    if (pos.length < 2 || neg.length < 2) return null;
    const fwd = pos.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
    const back = neg.slice().reverse().map(p => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(" ");
    return `${fwd} ${back} Z`;
  })();
  const hoverActive = !!(hoverDayPosBlocks || hoverDayNegBlocks);
  const hoverPosColor = AFRR_QUALITY_FILL[hoverPosQuality] || T.ink;
  const hoverNegColor = AFRR_QUALITY_FILL[hoverNegQuality] || T.ink;
  const peakIdx = (arr) => {
    let bestI = -1, bestV = -Infinity;
    (arr || []).forEach((v, i) => {
      if (v == null || isNaN(v)) return;
      if (v > bestV) { bestV = v; bestI = i; }
    });
    return bestI;
  };
  const posPeakI = peakIdx(posMonth);
  const negPeakI = peakIdx(negMonth);
  // Peak label/marker — edge-clamped, with an over-axis arrow when the
  // value exceeds the plotted range.
  const PeakMark = ({ i, v, dir, color }) => {
    if (i < 0 || v == null || isNaN(v)) return null;
    const over = v > yMax;
    const y = dir === "pos" ? yMarkPos(v) : yMarkNeg(v);
    const arrow = over ? (dir === "pos" ? "↑ " : "↓ ") : "";
    const text = `${arrow}€${v.toFixed(1)}`;
    // Mask the axis behind the number: a bg-colored rect sized to the label
    // (the 0-line is solid here, so the text halo alone isn't enough).
    const textY = dir === "pos" ? y - 8 : y + 16;
    const halfW = (text.length * 6.4) / 2 + 3;
    let cx = xCenter(i);
    cx = Math.max(padL + halfW, Math.min(w - padR - halfW, cx));
    return (
      <g pointerEvents="none">
        {!over && <HoverDot x={xCenter(i)} y={y} color={color} />}
        <rect x={cx - halfW} y={textY - 9} width={halfW * 2} height={12} fill={T.bg} />
        <HoverValueLabel
          x={xCenter(i)} y={y}
          text={text}
          place={dir === "pos" ? "above" : "below"}
          x1={padL} x2={w - padR}
          color={color}
        />
      </g>
    );
  };
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`}
         style={{ display: "block", overflow: "hidden" }}>
      <defs>
        <clipPath id={clipId}>
          <rect x={padL - 2} y={plotTop} width={innerW + 4} height={innerH} />
        </clipPath>
      </defs>
      {/* Y-axis ticks: POS half above midline, NEG half below. */}
      {[yMax, yMax / 2, 0, -yMax / 2, -yMax].map((t, i) => {
        const y = t >= 0 ? yScalePos(t) : yScaleNeg(-t);
        const isMid = t === 0;
        return (
          <g key={i}>
            <line x1={padL} x2={w - padR} y1={y} y2={y}
                  stroke={isMid ? T.line : T.lineSoft}
                  strokeWidth={isMid ? 1 : 0.5}
                  strokeDasharray={isMid ? "none" : "2 4"} />
            <text x={padL - 6} y={y + 3} textAnchor="end"
                  fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>
              {Math.abs(Math.round(t))}
            </text>
          </g>
        );
      })}
      {/* Direction labels — neutral; position carries direction. */}
      <text x={padL + 4} y={plotTop + 10}
            fontFamily="'JetBrains Mono', monospace" fontSize={9}
            fontWeight={700} fill={T.body}>POS ↑</text>
      <text x={padL + 4} y={plotBottom - 2}
            fontFamily="'JetBrains Mono', monospace" fontSize={9}
            fontWeight={700} fill={T.body}>NEG ↓</text>

      {/* Data layer — clipped to the plot so over-axis lines exit + re-enter. */}
      <g clipPath={`url(#${clipId})`}>
        {monthArea && <path d={monthArea} fill={T.wh} opacity={0.12} />}
        {posTrailing && (
          <path d={pathPos(posTrailing)} fill="none" stroke={T.mute}
                strokeWidth={1.1} strokeDasharray="3 3" opacity={0.7} />
        )}
        {negTrailing && (
          <path d={pathNeg(negTrailing)} fill="none" stroke={T.mute}
                strokeWidth={1.1} strokeDasharray="3 3" opacity={0.7} />
        )}
        <path d={pathPos(posMonth)} fill="none" stroke={T.wh}
              strokeWidth={1.8} opacity={0.85} />
        <path d={pathNeg(negMonth)} fill="none" stroke={T.wh}
              strokeWidth={1.8} opacity={0.85} />
        {!hoverActive && posMonth.map((v, i) => (v == null || isNaN(v) ? null :
          <circle key={`mp${i}`} cx={xCenter(i)} cy={yScalePos(v)} r={1.8}
                  fill={T.wh} opacity={0.85} />
        ))}
        {!hoverActive && negMonth.map((v, i) => (v == null || isNaN(v) ? null :
          <circle key={`mn${i}`} cx={xCenter(i)} cy={yScaleNeg(v)} r={1.8}
                  fill={T.wh} opacity={0.85} />
        ))}
        {posBlocks && (
          <>
            <path d={pathPos(posBlocks)} fill="none"
                  stroke={hoverPosColor} strokeWidth={2.4} />
            {posBlocks.map((v, i) => (v == null || isNaN(v) ? null :
              <circle key={`dp${i}`} cx={xCenter(i)} cy={yScalePos(v)} r={2.8}
                      fill={hoverPosColor} />
            ))}
          </>
        )}
        {negBlocks && (
          <>
            <path d={pathNeg(negBlocks)} fill="none"
                  stroke={hoverNegColor} strokeWidth={2.4} />
            {negBlocks.map((v, i) => (v == null || isNaN(v) ? null :
              <circle key={`dn${i}`} cx={xCenter(i)} cy={yScaleNeg(v)} r={2.8}
                      fill={hoverNegColor} />
            ))}
          </>
        )}
      </g>

      {/* Block labels in a band below the plot: time window + period name. */}
      {blockLabels.map((lbl, i) => (
        <g key={`x${i}`}>
          <text x={xCenter(i)} y={plotBottom + 15} textAnchor="middle"
                fontFamily="'JetBrains Mono', monospace" fontSize={9.5}
                fontWeight={700} fill={T.body}>{lbl}</text>
          {periodLabels[i] && (
            <text x={xCenter(i)} y={plotBottom + 29} textAnchor="middle"
                  fontFamily="'Source Serif 4', serif" fontStyle="italic"
                  fontSize={10.5} fill={T.mute}>{periodLabels[i]}</text>
          )}
        </g>
      ))}

      {/* Peak markers + over-axis labels (outside clip, edge-clamped). */}
      {posBlocks && (() => { const pi = peakIdx(posBlocks); return <PeakMark i={pi} v={posBlocks[pi]} dir="pos" color={hoverPosColor} />; })()}
      {negBlocks && (() => { const pi = peakIdx(negBlocks); return <PeakMark i={pi} v={negBlocks[pi]} dir="neg" color={hoverNegColor} />; })()}
      {/* No day hovered → the month-average peak labels are neutral grey;
          they're just the line's extremes, not a good/bad signal. Colour is
          reserved for the hover state, where it encodes the day's quality. */}
      {!hoverActive && <PeakMark i={posPeakI} v={posMonth[posPeakI]} dir="pos" color={T.mute} />}
      {!hoverActive && <PeakMark i={negPeakI} v={negMonth[negPeakI]} dir="neg" color={T.mute} />}

      {/* Hover-day label */}
      {hoverDayLabel && (
        <text x={w - padR - 4} y={plotTop + 10}
              textAnchor="end"
              fontFamily="'JetBrains Mono', monospace" fontSize={9.5}
              fontWeight={700} fill={T.ink}>
          {hoverDayLabel}
        </text>
      )}
    </svg>
  );
};

// ── aFRR Daily regime calendar (§04, hover bus) ─────────────────
// Tile background encodes potential — green = strong day for capacity
// (mirrors the §03 TB2 bar tone logic). Glyph encodes the regime label
// (solar surplus / evening scarcity / low-wind scarcity / mixed / normal
// / noisy). On hover, emits the date so the fingerprint charts above
// can overlay that day's per-block line.
const QUALITY_FILL = {
  EXCEPTIONAL: "#3C7A0C",  // T.high (deep green)
  GOOD:        "#7AB341",  // mid green
  MID:         "#E3DBC8",  // neutral warm tint
  SOFT:        "#F5F2E8",  // very pale
};
const QUALITY_FG = {
  EXCEPTIONAL: "#FFFFFF",
  GOOD:        "#FFFFFF",
  MID:         "#3C3934",
  SOFT:        "#7A746A",
};
const REGIME_GLYPH = {
  solar_surplus: "☀",       // same as §03 wholesale "sun" tag
  evening_scarcity: "▲",
  low_wind_scarcity: "▼",
  mixed: "⇅",                // tight both ways: POS↑ + NEG↓ both elevated
  noisy: "",                 // no glyph — no clear physical driver to point to
  normal: "",                // no glyph — default state
};

const AfrrDailyRegimeCalendar = ({
  days = [], hoverDay = null, onHover = () => {},
  w = 620, h = 150,
}) => {
  if (!days.length) {
    return (
      <div style={{
        height: h, display: "flex", alignItems: "center", justifyContent: "center",
        fontFamily: "'Source Serif 4', serif", fontStyle: "italic",
        color: T.mute, fontSize: 12,
      }}>No daily regime data this month.</div>
    );
  }
  const parsed = days.map(d => ({
    ...d,
    ts: new Date(d.date + "T00:00:00"),
  })).sort((a, b) => a.ts - b.ts);
  const first = parsed[0].ts;
  const last = parsed[parsed.length - 1].ts;
  const dow = (d) => (d.getDay() + 6) % 7;
  const colsOffset = dow(first);
  const totalDays = Math.round((last - first) / 86400000) + 1 + colsOffset;
  const rows = Math.ceil(totalDays / 7);
  const tileW = (w - 80) / 7;
  const tileH = (h - 30) / Math.max(rows, 1);
  const padL = 70;
  const tiles = [];
  parsed.forEach(d => {
    const offset = Math.round((d.ts - first) / 86400000);
    const slot = offset + colsOffset;
    const row = Math.floor(slot / 7);
    const col = slot % 7;
    const x = padL + col * tileW;
    const y = 20 + row * tileH;
    const fill = QUALITY_FILL[d.quality_bucket] || QUALITY_FILL.MID;
    const fg = QUALITY_FG[d.quality_bucket] || QUALITY_FG.MID;
    const glyph = REGIME_GLYPH[d.regime_label] || "·";
    const day = d.ts.getDate();
    const isHovered = hoverDay === d.date;
    tiles.push(
      <g key={d.date}
         onMouseEnter={() => onHover(d.date)}
         onMouseLeave={() => onHover(null)}
         style={{ cursor: "pointer" }}>
        <rect x={x + 1.5} y={y + 1.5}
              width={tileW - 3} height={tileH - 3}
              fill={fill}
              stroke={isHovered ? T.ink : T.line}
              strokeWidth={isHovered ? 1.6 : 0.5}
              rx={2} />
        <text x={x + 5} y={y + 11}
              fontFamily="'JetBrains Mono', monospace" fontSize={9}
              fontWeight={700} fill={fg}>
          {day}
        </text>
        {glyph && (
          <text x={x + tileW / 2} y={y + tileH / 2 + 7}
                textAnchor="middle"
                fontFamily="'Source Serif 4', serif"
                fontSize={Math.min(tileH * 0.55, 18)}
                fill={fg}>
            {glyph}
          </text>
        )}
      </g>
    );
  });
  const dowLabels = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}>
      {dowLabels.map((lbl, i) => (
        <text key={lbl} x={padL + (i + 0.5) * tileW} y={14}
              textAnchor="middle"
              fontFamily="'JetBrains Mono', monospace" fontSize={9}
              fill={T.mute}>{lbl}</text>
      ))}
      <text x={6} y={20 + tileH / 2 + 4}
            fontFamily="'JetBrains Mono', monospace" fontSize={9}
            fill={T.mute}>
        {parsed[0].ts.toLocaleString("en-US", { month: "short" })} {parsed[0].ts.getFullYear()}
      </text>
      {tiles}
    </svg>
  );
};

// ── 12-month per-stream stacked AREAS + heavy realised line + central scenario (§01 primary) ─
// Same sparkline grammar as §02 StreamRow, but split by market — each stream's
// share rendered as a pale filled band, stacked bottom→top.
const Stack22moFan = ({ months, streams, realised, central, currentIdx, yMaxOverride = null, w = 760, h = 290 }) => {
  const padL = 38, padR = 24, padT = 22, padB = 32;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const [hoverIdx, setHoverIdx] = React.useState(null);
  const n = months.length;
  // Stack order bottom→top: wh → acap → fcr → aeng.
  const streamMeta = [
    { id: "wh",   color: T.wh },
    { id: "acap", color: T.acap },
    { id: "fcr",  color: T.fcr },
    { id: "aeng", color: T.aeng },
  ];
  // y-extent driven by realised + central scenario.
  const all = [...realised, ...central];
  const rawMax = Math.max(...all) * 1.05;
  // yMaxOverride locks the axis to a fixed (union) scale so the M×12 ↔
  // rolling morph animates inside a stable frame — without it the y-axis
  // rescales every tween frame and the whole coordinate system warps.
  const yMax = yMaxOverride != null ? yMaxOverride : Math.ceil(rawMax / 5) * 5;
  const yMin = 0;
  const yScale = v => padT + (1 - (v - yMin) / (yMax - yMin)) * innerH;
  const slot = innerW / n;
  const xCenter = i => padL + (i + 0.5) * slot;
  const pathOf = data => data.map((v, i) => `${i ? "L" : "M"}${xCenter(i).toFixed(1)} ${yScale(v).toFixed(1)}`).join(" ");
  const ticks = [0, yMax * 0.25, yMax * 0.5, yMax * 0.75, yMax];
  // Per-month cumulative tops, bottom→top.
  const cumTops = Array.from({ length: n }, () => streamMeta.map(() => 0));
  for (let i = 0; i < n; i++) {
    let s = 0;
    for (let k = 0; k < streamMeta.length; k++) {
      const v = (streams && streams[streamMeta[k].id] && streams[streamMeta[k].id][i]) || 0;
      s += v > 0 ? v : 0;
      cumTops[i][k] = s;
    }
  }
  // Closed-area band for stream k (between previous cumulative top and this one).
  const areaPath = (k) => {
    const top = [];
    for (let i = 0; i < n; i++) {
      top.push(`${i ? "L" : "M"}${xCenter(i).toFixed(1)} ${yScale(cumTops[i][k]).toFixed(1)}`);
    }
    const bot = [];
    for (let i = n - 1; i >= 0; i--) {
      const y = k === 0 ? 0 : cumTops[i][k - 1];
      bot.push(`L${xCenter(i).toFixed(1)} ${yScale(y).toFixed(1)}`);
    }
    return top.join(" ") + " " + bot.join(" ") + " Z";
  };
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: "block" }}
         onMouseLeave={() => setHoverIdx(null)}>
      {/* Y gridlines + labels */}
      {ticks.map((t, i) => (
        <g key={i}>
          <line x1={padL} x2={w - padR} y1={yScale(t)} y2={yScale(t)} stroke={i === 0 ? T.line : T.lineSoft} strokeWidth={i === 0 ? 0.8 : 0.6} strokeDasharray={i === 0 ? "none" : "2 4"} />
          <text x={padL - 6} y={yScale(t) + 3} textAnchor="end" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute}>{t.toFixed(0)}</text>
        </g>
      ))}
      {/* X month labels (every 3rd + last) */}
      {months.map((m, i) => {
        const show = i % 3 === 0 || i === months.length - 1;
        if (!show) return null;
        const isCurr = i === currentIdx;
        return (
          <text key={i} x={xCenter(i)} y={h - padB + 14} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={isCurr ? T.ink : T.mute} fontWeight={isCurr ? 700 : 500}>{m}</text>
        );
      })}
      {/* Y axis label — placed just above the top tick label to avoid overlap. */}
      <text x={6} y={padT - 6} fontFamily="'JetBrains Mono', monospace" fontSize={9} fill={T.mute} letterSpacing="0.06em">k€/MW</text>
      {/* Per-stream stacked filled bands — pale, in market colors. */}
      {streamMeta.map(({ id, color }, k) => (
        <path key={id} d={areaPath(k)} fill={color} opacity={0.32} />
      ))}
      {/* Central scenario dashed reference line. */}
      <path d={pathOf(central)}  fill="none" stroke={T.mute} strokeWidth={1.2} strokeDasharray="6 4" opacity={0.9} strokeLinecap="round" />
      {/* Heavy realised total line — sits on top of the stack total. */}
      <path d={pathOf(realised)} fill="none" stroke={T.ink}  strokeWidth={2.4} opacity={1} strokeLinecap="round" strokeLinejoin="round" />
      {/* Current-month marker. */}
      {currentIdx != null && (
        <g>
          <line x1={xCenter(currentIdx)} x2={xCenter(currentIdx)} y1={padT} y2={h - padB} stroke={T.ink} strokeWidth={0.7} strokeDasharray="3 3" opacity={0.3} />
          <circle cx={xCenter(currentIdx)} cy={yScale(realised[currentIdx])} r={4} fill={T.ink} stroke={T.bg} strokeWidth={1.5} />
          <text x={xCenter(currentIdx)} y={yScale(realised[currentIdx]) - 10} textAnchor="middle" fontFamily="'JetBrains Mono', monospace" fontSize={10} fontWeight={700} fill={T.ink}>{realised[currentIdx].toFixed(1)}k</text>
        </g>
      )}
      {/* Hover hit-zones — one wedge per month covering the full chart
          height. Same crosshair+value vocabulary as every other chart. */}
      {months.map((m, i) => (
        <rect key={`hz${i}`}
              x={padL + i * (innerW / n)} y={padT}
              width={innerW / n} height={innerH}
              fill="transparent" pointerEvents="all"
              onMouseEnter={() => setHoverIdx(i)} />
      ))}
      {hoverIdx != null && realised[hoverIdx] != null && (() => {
        const i = hoverIdx;
        // Per-market breakdown at the hovered month + the realised total.
        // Values are in the chart's current metric (k€/MW, M×12 or
        // rolling), so the rows sum to the total line.
        const rows = streamMeta.map(({ id }) => ({
          color: STREAMS[id].color,
          label: STREAMS[id].short,
          value: `${(((streams && streams[id]) ? streams[id][i] : 0) || 0).toFixed(1)}k`,
        }));
        rows.push({ label: "Total", value: `${realised[i].toFixed(1)}k`, strong: true });
        return (
          <g pointerEvents="none">
            <HoverLine x={xCenter(i)} y0={padT} y1={padT + innerH} opacity={0.4} />
            <HoverDot x={xCenter(i)} y={yScale(realised[i])} />
            <HoverTooltip
              x={xCenter(i)} y={yScale(realised[i])} x1={padL} x2={w - padR}
              yTop={padT} yBot={padT + innerH}
              title={months[i]} rows={rows} width={158}
            />
          </g>
        );
      })()}
    </svg>
  );
};

    fontFamily: "'JetBrains Mono', monospace", fontSize: 10,
    letterSpacing: "0.12em", textTransform: "uppercase",
